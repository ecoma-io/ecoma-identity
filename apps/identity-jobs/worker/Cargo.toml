[package]
name = "identity-jobs-worker"
description = "The Jobs Worker: a queue consumer for email, security notifications and audit archival. Owns no identity state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The composition root for `identity-jobs`.
#
# The absence of `identity-domain` and `identity-application` from this list
# is the architecture, not an oversight: a background worker that could reach
# the domain model could reach identity state, and "it only needs the User
# type" is how that dependency starts. Jobs receives payloads, validates them
# against `identity-security`'s idempotency gate, and calls out — it has no
# use-case vocabulary to borrow, so it is not given one.
#
# It has no D1 binding at all in the bootstrap configuration. It talks to
# Identity over the service binding when it needs to, and it owns its own
# dead-letter handling.
[dependencies]
identity-cloudflare = { workspace = true }
identity-security = { workspace = true }
worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
