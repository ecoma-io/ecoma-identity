[package]
name = "identity-jobs-worker"
description = "The Jobs Worker: a queue consumer for email, security notifications and audit archival. Owns no identity state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The composition root for `identity-jobs`.
#
# THE ABSENCE IN THIS LIST IS THE ARCHITECTURE, and it is a bigger absence than
# it first looks. This Worker may not reach `identity-domain` or
# `identity-application` — not directly, and not through anything else either.
#
# That rules out more than the two obvious crates. `identity-cloudflare`,
# `identity-oidc` and `identity-security` ALL depend on `identity-domain`, so
# depending on any of them carries the identity rule engine in with it, and the
# isolation this manifest claims would be a comment rather than a control. A
# version of this file that named `identity-security` and then explained that it
# was safe because it only wanted the idempotency gate is exactly the erosion
# `docs/architecture/jobs-isolation.md` warns about, and `pnpm arch` judges it by
# REACHABILITY rather than by this manifest, so it does not matter how the
# dependency is spelled here.
#
# The cost is real and is paid on purpose: this Worker does not get to share the
# error envelope or the response builder the other two deployables use, so its
# route table, its 501 envelope and its health payload live in this crate. The
# durable fix is to split those wire types into a crate that does not depend on
# `identity-domain` and let all three Workers share that one; until it exists,
# the duplication is what the isolation costs. See
# `docs/architecture/crate-dependency-law.md`.
#
# It has no D1 binding at all in the bootstrap configuration. It talks to
# Identity over the service binding when it needs to, and it owns its own
# dead-letter handling.
[lib]
# `cdylib` because `worker-build` refuses anything else for
# `wasm32-unknown-unknown` ("crate-type must be cdylib to compile to
# wasm32-unknown-unknown"). `rlib` is kept alongside it so `cargo test` and
# `cargo doc` have a library to build on the host — without it this crate is
# unbuildable as a dependency of anything, including its own test harness.
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
