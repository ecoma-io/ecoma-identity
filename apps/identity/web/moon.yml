# Moon configuration for the end-user identity UI.
#
# A frontend half, not a deployable: its `dist/` is uploaded by the `identity`
# Worker's version and is part of the same release unit (ADR-0015). It has no
# `wrangler.jsonc` of its own and is never deployed alone.
#
# This file arrived with the i18n work, because `@ecoma-io/frontend-preferences`
# resolves through its `dist/` and the dependency has to be expressed somewhere
# the task graph can act on. See `docs/architecture/overview.md` for the
# deployable map and `packages/frontend-preferences/README.md` for the library
# itself.
#
# Everything below `tags:` is the same as `apps/identity-admin/web`'s, character for
# character, and that is deliberate rather than a copy-paste that has drifted:
# both apps read the same projection, and the one thing the inline render below
# has to get right — render, THEN read, in that order, with no cached answer in
# between — is a property of the mechanism rather than of the app. A future edit
# applied to one copy and not the other is a bug in exactly one of the two
# applications, which is what the shared text prevents.

tags:
  - identity-web

# ---------------------------------------------------------------------------
# WHY SEVERAL TASKS REPEAT THE SAME THREE LINES
# ---------------------------------------------------------------------------
#
# Every task that reads `.generated/frontend/config.json` renders it first, and
# they share this snippet rather than each having its own copy:
#
#   FRONTEND_ENVIRONMENT="${FRONTEND_ENVIRONMENT:-development}" \
#   node tooling/scripts/render-wrangler-config.mjs --stage offline \
#     --environment "$FRONTEND_ENVIRONMENT" --write
#
# The reason is a constraint moon 2.5.6 imposes rather than a choice:
#
#   - `.generated/` is at the WORKSPACE ROOT, outside every project directory,
#     so it cannot be an `inputs:` entry. moon rejects the `..` traversal
#     outright — "parent directory traversal (..) is not supported" — so a task
#     cannot be made to depend on the file by declaring it.
#   - A `:`-relative or implicit local `deps:` target is rejected too. Only
#     `project:task` targets are accepted, so there is no `deps: [":render"]` to
#     hang the render off.
#
# What is left is the precedent `apps/home-web`'s `wrangler-validate` already
# sets: render INLINE, inside the script, immediately before the command that
# reads it. That gives ordering, which is what actually matters — the config is
# written before Vite or `vue-tsc` starts.
#
# It does NOT give invalidation, which is why each of these tasks also sets
# `options.cache: false`. A cached `build` would report a hit while serving a
# bundle assembled from a projection of a topology the cache never looked at,
# and the cache key cannot include a file outside the project. `cache: false`
# costs a rebuild; a stale cookie name in a shipped bundle costs a preference
# that silently stops following the visitor between applications.
#
# There is deliberately no `rm -f` before the render. An earlier version of this
# file deleted the config first, reasoning that a failed render would otherwise
# leave the previous environment's file in place for the next command to read.
# It would not: the renderer exits non-zero on every failure path and `set -eu`
# stops the task at the failed render, so the bundler is never reached with a
# stale config. The delete bought no correctness and cost real correctness — the
# file is shared with `frontend-preferences` and `home-web`, and under `moon ci`,
# where projects run CONCURRENTLY, this task's `rm` could land between that
# package's compile reading the file and `tsc` resolving it, failing an unrelated
# project with `TS2307`. A task must not delete state another project reads. The
# per-environment copy (`.generated/frontend/<environment>.json`) remains the
# record of what was rendered; the shared copy is what each task overwrites
# immediately before reading it.
#
# `FRONTEND_ENVIRONMENT` defaults to `development`. The deploy workflows export
# the real environment before invoking moon, so a production bundle is built
# against production's cookie namespace; locally, `development` is the honest
# default, and `wrangler.jsonc` for every other environment is generated by
# `pnpm infra:render` rather than by these tasks.

tasks:
  format-check:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/prettier" --check --ignore-unknown --ignore-path "$MOON_WORKSPACE_ROOT/.prettierignore" --ignore-path "$MOON_WORKSPACE_ROOT/.gitignore" .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md,css,html}"
    outputs: []

  # This app was outside the workspace lint gate until now — it had no
  # `moon.yml`, and the pre-commit hook was the only thing running eslint over
  # it. That is how a floating promise in `main.ts` reached a commit. The gate
  # exists; it was simply not wired to this project.
  lint:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/eslint" .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue}"
    outputs: []

  # `vue-tsc` reads the projection through `@ecoma-io/frontend-preferences`,
  # which imports it at module scope, so typechecking without a render is a
  # `MissingFrontendConfigError` rather than a type error. That is the right
  # failure — but it is a confusing one from `pnpm typecheck`, so the render is
  # inline here for the same reason it is in `build`.
  typecheck:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      environment="${FRONTEND_ENVIRONMENT:-development}"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "$environment" --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/vue-tsc" --noEmit
    deps:
      - "frontend-preferences:build"
    options:
      cache: false
    inputs:
      - "src/**/*.{ts,vue}"
      - "tests/**/*.{ts,vue}"
      - "tsconfig.json"
      - "vite.config.ts"
    outputs: []

  test:
    script: 'cd "$MOON_PROJECT_ROOT" && "$MOON_PROJECT_ROOT/node_modules/.bin/vitest" run'
    deps:
      - "frontend-preferences:build"
    options:
      cache: false
    inputs:
      - "src/**/*.{ts,vue}"
      - "tests/**/*.{ts,vue}"
      - "index.html"
      - "src/config.ts"
      - "src/test-setup.ts"
    outputs: []

  # `deps: ["frontend-preferences:build"]` is load-bearing, not a convenience.
  #
  # `@ecoma-io/frontend-preferences` declares `main`/`types` pointing at `dist/`,
  # which is gitignored — so on a clean checkout it has no entry point until
  # something builds it. Without this line the build fails with
  #
  #   Rolldown failed to resolve import "@ecoma-io/frontend-preferences"
  #
  # which reads as a bundler misconfiguration and is not one: the package is
  # fine, it simply has not been compiled yet. Naming the dependency in the task
  # graph fixes it for every workflow, rather than restating the same build step
  # in each one that happens to need this app.
  #
  # Named rather than `^build`: moon 2.5.6 has no `^` shorthand — it rejects the
  # form outright with `Invalid target ~:^build`. `frontend-preferences` is also
  # the only workspace dependency either web app has, so the wildcard would not
  # buy anything here today.
  build:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      environment="${FRONTEND_ENVIRONMENT:-development}"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "$environment" --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/vite" build
    deps:
      - "frontend-preferences:build"
    options:
      cache: false
    inputs:
      - "src/**/*.{ts,vue,json,css}"
      - "tests/**/*.{ts,vue}"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
    outputs:
      - "dist/**/*"

  # The render is inline here for the same reason as in `build`, and it is the
  # only difference from `build`: a long-running dev server reads the config
  # once per start, and a restart after a topology change must not serve the
  # previous environment's cookie name. Restarting `moon run identity-web:dev`
  # re-renders; nothing else has to be remembered.
  dev:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      environment="${FRONTEND_ENVIRONMENT:-development}"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "$environment" --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/vite"
    deps:
      - "frontend-preferences:build"
    options:
      runInCI: false
      cache: false
    inputs: []
    outputs: []
