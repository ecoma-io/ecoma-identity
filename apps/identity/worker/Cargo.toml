[package]
name = "identity-worker"
description = "The Identity Worker: OIDC, authentication, sessions, self-service, and the sole owner of Identity D1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The composition root for `identity`. It is allowed to name the `worker`
# crate and the binding names, because that is what wiring *is*. It is not
# allowed to contain policy: the health routes, the OIDC route table, the
# error envelope and the request-id plumbing all come from
# `identity-cloudflare` so the three Workers cannot drift apart on any of
# them.

# `worker-build` refuses to build a crate whose manifest does not declare a
# `cdylib` target ("crate-type must be cdylib to compile to
# wasm32-unknown-unknown"), and the `rlib` is what lets `cargo test -p
# identity-worker` and `cargo doc -p identity-worker` run on the host at all.
# Both are required: dropping `cdylib` makes the Worker undeployable, and
# dropping `rlib` makes every host-target task in `moon.yml` fail.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
identity-domain = { workspace = true }
identity-application = { workspace = true }
identity-oidc = { workspace = true }
identity-security = { workspace = true }
identity-cloudflare = { workspace = true }
worker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
