# identity-worker — the composition root for `identity`: OIDC,
# authentication, sessions, self-service, and the SOLE owner of Identity D1.
#
# THE BOUNDARY THIS FILE STATES: this Worker is the only deployable that holds
# an `IDENTITY_DB` binding, and it is the only one that may name the domain and
# application layers. It is allowed to name the `worker` crate and the binding
# names, because that is what wiring *is*; it is not allowed to contain policy,
# which is why the route table, the error envelope and the health routes all
# come from `identity-cloudflare`.
# `tooling/scripts/check-architecture.mjs` judges the dependency law from
# `cargo metadata`, so none of that can be undone by a manifest edit.
#
# This is the file `moon run identity:dev` and the `identity:*` aliases in the
# root `moon.yml` resolve to. The root file maps the deployment-boundary name
# `identity` onto this project's id `identity-worker`.

$schema: https://moonrepo.dev/schemas/moon.json

tags:
  - rust
  - worker
  - deployable
  - identity

tasks:
  # HOST TARGET, and this is the whole reason a Worker project needs its own
  # moon.yml at all: the root vocabulary is a `prettier --write` aimed at
  # JavaScript. A `prettier --write` aimed at a Rust crate is a task that
  # reformats nothing and reports success, which is the state
  # `boundary-5-worker-registration` exists to refuse.
  format:
    command: "cargo fmt -p identity-worker"
    options:
      cache: false

  # `format-check`, not `format:check` — moon 2.5.6 rejects a colon in a
  # PROJECT-level task id ("Invalid identifier format"). Verified against
  # moon 2.5.6: the colon spelling fails to parse, the dashed one resolves.
  # See the note in crates/identity-domain/moon.yml.
  format-check:
    command: "cargo fmt -p identity-worker -- --check"
    options:
      cache: false

  # `-D warnings`: a clippy warning nobody reads is a warning nobody fixes.
  lint:
    command: "cargo clippy -p identity-worker --all-targets -- -D warnings"
    options:
      cache: false

  typecheck:
    command: "cargo check -p identity-worker --all-targets"
    options:
      cache: false

  # `--locked` because `Cargo.lock` is committed and a push that resolves
  # differently from CI fails in someone else's pipeline.
  test:
    command: "cargo test -p identity-worker --locked"
    options:
      cache: false

  test-unit:
    command: "cargo test -p identity-worker --locked --lib"
    options:
      cache: false

  # ---------------------------------------------------------------------------
  # THE WORKERS TARGET. Only `build` and `package` need it.
  #
  # format, lint, typecheck and test all run on the host above, deliberately:
  # `worker` 0.8.7 compiles for the host as well as for wasm32, so a wasm32
  # build here would not fail, it would just recompile the whole dependency
  # graph for a target no test runs on. The wasm32 compile is the deployable's
  # actual deliverable, so it is the one that gets the target flag.
  # ---------------------------------------------------------------------------
  build:
    command: "cargo build -p identity-worker --locked --target wasm32-unknown-unknown"
    options:
      cache: false

  dev:
    # `options.runInCI: false`, not the root file's `local: 'only'` — moon 2.5.6
    # has no `local` field on a task, so the root file's spelling is inert.
    # `wrangler dev` binds a port and never returns: a task that never
    # terminates is a pipeline that hangs, and it must never be one.
    #
    # `script:`, not `command:`, because wrangler is a pnpm-installed binary
    # and is NOT on the PATH moon gives a task — moon does not add
    # `node_modules/.bin`. Verified: `command: 'wrangler …'` exits 127.
    #
    # `--cwd` is deliberately NOT used even though wrangler supports it: it
    # re-roots the config's own relative paths (`main`, `migrations_dir`,
    # `assets.directory`), and the build command inside
    # `infra/cloudflare/development/identity/wrangler.jsonc` resolves
    # `../../../../apps/identity/worker` against the process working directory.
    # Verified: with `--cwd` the custom build cannot find the crate; run from
    # the config's own directory it does.
    script: 'cd "$MOON_WORKSPACE_ROOT/infra/cloudflare/development/identity" && "$MOON_WORKSPACE_ROOT/node_modules/.bin/wrangler" dev --config wrangler.jsonc'
    options:
      runInCI: false
    inputs: []
    outputs: []

  # A release build of the deployable for the target it ships to. There is no
  # published package (`publish = false` in Cargo.toml), so this is a release
  # wasm artefact and nothing more — a `package` task that claimed to produce a
  # distributable here would be a task reporting success without doing the
  # thing its name says.
  package:
    command: "cargo build -p identity-worker --locked --release --target wasm32-unknown-unknown"
    options:
      cache: false

  # ---------------------------------------------------------------------------
  # wrangler:validate — `wrangler deploy --dry-run` against the DEVELOPMENT
  # config. Dry-run runs wrangler's own checks without uploading, so it is a
  # real check of the thing that ships rather than a command that exits 0.
  #
  # It runs the preflight FIRST, and that ordering is the point. `wrangler
  # deploy --dry-run` executes the config's `build.command` before any of its
  # own checks, and that command is `cargo install worker-build`, whose
  # dependency graph reaches `openssl-sys` and therefore needs the system
  # OpenSSL headers. On a machine without them, wrangler dies with a bare
  # `exit code 1` and the real error sits in a timestamped file under
  # ~/.config/.wrangler/logs/ — a failing check reported in a way that costs a
  # debugging session, which is the same defect as a check reporting success
  # without running. The preflight names the missing prerequisite instead.
  #
  # The preflight is NOT a substitute for the dry-run and does not claim to be:
  # it performs none of wrangler's checks. It only refuses to spend a dry-run
  # on a machine where the build half is known-impossible.
  #
  # If `wrangler` is not installed this fails loudly and non-zero: the binary
  # path is absolute and non-existent, the shell exits 127, moon propagates the
  # non-zero exit. A `|| true` here would make "the check did not run"
  # indistinguishable from "the check passed", which is the one outcome this
  # task must never produce.
  # ---------------------------------------------------------------------------
  wrangler-validate:
    script: |
      cd "$MOON_WORKSPACE_ROOT/infra/cloudflare/development/identity" || exit 1
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/check-worker-build-prereqs.mjs" "$PWD" || exit 1
      "$MOON_WORKSPACE_ROOT/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.jsonc
    options:
      cache: false
    # Project-relative, and BARE: a project-level `inputs:` block resolves
    # against the project root and not against the workspace root, and the
    # `@files(…)` / `@globs(…)` token wrappers do not parse here — moon 2.5.6
    # fails the whole config with "Failed to create glob from pattern".
    # Verified against moon 2.5.6; the token form is a root-workspace spelling
    # and the bare form is the project-level one.
    #
    # The wrangler config lives outside this project and is therefore not an
    # input. `cache: false` below is what makes that irrelevant: the task
    # re-runs every time, so a changed wrangler config can never be answered
    # from a stale cache.
    inputs:
      - "Cargo.toml"
      - "src/**/*"
    outputs: []
