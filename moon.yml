$schema: https://moonrepo.dev/schemas/moon.json

# Root task vocabulary. Project-level `moon.yml` files override any task
# defined here, so a Rust project replaces the JavaScript-flavoured `format`
# below with `cargo fmt` without the root having to know about Rust.
#
# The task names here are the contract in `docs/architecture/deployment-model.md`
# and `AGENTS.md`: CI, lefthook and the deploy workflows all address tasks by
# name, so renaming one is a cross-repo-visible change.
#
# `cache: false` on the cargo tasks is deliberate and matches the org's other
# repositories: cargo's own `target/` directory and `Cargo.lock` are the cache
# of record, and a moon-cached cargo task that misses an input (a workspace-
# level dependency change, a lint config) would report a stale verdict as
# green. Slow and honest beats fast and wrong.
#
# THERE IS NO `projects:` BLOCK HERE, and the absence is a correction rather
# than an omission. This file used to carry
#
#   projects:
#     identity: identity-worker
#     identity-admin: identity-admin-worker
#     identity-jobs: identity-jobs-worker
#
# with a comment explaining that the map is what makes `moon run identity:dev`
# resolve. It never did: moon 2.5.6 reads that key as GLOBAL projects, has no
# alias mechanism for projects at all, and ignored the block without a word.
# `moon run identity:dev` — the command in AGENTS.md and README.md — failed
# with `project_graph::unknown_id`, as did the staging deploy that runs
# `moon run "$WORKER:package"` with the same names. The deployable names are
# now the PROJECT IDS in `.moon/workspace.yml`, which is the only place moon
# reads project names from and the only place a new module must be declared.
# `docs/operations/deployment-model.md` owns the naming story; ADR-0002
# records the mapping as a consequence of the three-deployable law.
#
# Having two maps was the hazard, not one of them: a reader who added a
# project to the root file and not to the workspace file would see no error
# anywhere, because a global-project declaration for a path inside this
# repository is itself silently dropped.

tasks:
  # ---- format / lint / typecheck -------------------------------------------
  format:
    command: 'prettier --write --ignore-unknown "{moonWorkspaceRoot}/**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md,css,html}"'
    inputs:
      - "@globs(scripts/**/*)"
      - "@globs(tooling/**/*)"
      - '@files("**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md,css,html}")'
    outputs:
      - "@globs(scripts/**/*)"
      - "@globs(tooling/**/*)"
      - "@globs(apps/**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md,css,html})"
      - "@globs(crates/**/*.{js,mjs,cjs,ts,json,jsonc,yml,yaml,md,css,html})"
      - "@globs(tests/**/*.{js,mjs,cjs,ts,json,jsonc,yml,yaml,md,css,html})"
      - "@globs(docs/**/*.md)"

  format:check:
    command: "prettier --check --ignore-unknown ."
    inputs:
      - '@files("**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md,css,html}")'
    outputs: []

  lint:
    command: "eslint ."
    inputs:
      - "@globs(scripts/**/*)"
      - "@globs(tooling/**/*)"
      - '@files("**/*.{js,mjs,cjs,ts,vue}")'
    outputs: []

  typecheck:
    command: "tsc --noEmit"
    inputs:
      - "@globs(scripts/**/*.{ts,tsx,cts,mts,js,mjs,cjs})"
      - "@globs(tooling/**/*.{ts,tsx,cts,mts,js,mjs,cjs})"
      - "@files(tsconfig.json)"
    outputs: []

  # ---- tests ---------------------------------------------------------------
  test: {}
  test-unit: {}

  # ---- build / dev ---------------------------------------------------------
  build:
    inputs:
      - "@files(scripts/**/*)"
      - "@globs(scripts/**/*)"
    outputs:
      - "@globs(dist/**/*)"

  dev:
    local: "only"
    # `dev` starts a long-running process. It is never cached, never part of
    # `moon ci`, and `local: only` keeps it off CI entirely — a task that never
    # returns is a task that hangs a pipeline.
    inputs: []
    outputs: []

  # ---- package / deploy ----------------------------------------------------
  package:
    inputs:
      - "@files(scripts/**/*)"
    outputs:
      - "@globs(target/**/*)"

  wrangler-validate:
    inputs: []
    outputs: []
