# Moon configuration for the frontend-preferences package.
#
# This package owns preference MECHANICS for all frontend applications: locale
# detection and normalisation, the colour-mode attribute, display time-zone
# detection, the cookie policy, and the resolution order. It owns no translation
# catalog and no business or user data.
#
# See packages/frontend-preferences/README.md for the architecture and usage.
#
# Every task below RENDERS `.generated/frontend/config.json` first, for the same
# reason and with the same constraints as the two web apps' tasks: the file lives
# outside every project directory, so moon's `inputs:` cannot express it (moon
# 2.5.6 rejects `../x` outright — "parent directory traversal (..) is not
# supported") and only `project:task` deps are accepted, so there is no local
# `deps: [":render"]` to hang it off. Rendering inline is the repository's own
# precedent.
#
# IT MATTERS HERE MORE THAN IT DOES IN THE APPS, because this is the only project
# that COMPILES the import. The apps bundle it, and a missing file surfaces as a
# bundler error naming the path; here it surfaces as `TS2307: Cannot find module
# '../../../.generated/frontend/config.json'` from `tsc` — a diagnostic that
# names neither which task deleted it nor that the file is generated at all. And
# the failure is easy to reach: `pnpm verify` runs `typecheck` BEFORE
# `infra:render`, so on a clean checkout — or after any task that clears
# `.generated/` — this project has to produce the file itself or `tsc` cannot
# resolve its own source.
#
# NOTE WHAT IT DOES NOT DO, because the obvious next step is wrong: it never
# DELETES that file. It is shared with `apps/home-web` and both Vue apps, and
# `moon ci` runs projects CONCURRENTLY. An earlier version of the app tasks
# deleted it before rendering, and under concurrency that delete landed between
# this project's compile reading the file and `tsc` resolving it. Writing the
# file is safe from any number of concurrent tasks; deleting it is not.
#
# A note on the missing `dist` input, because it is load-bearing rather than an
# oversight: the config `src/config.ts` imports is gitignored and lives outside
# every project directory, so moon's `inputs:` cannot express it. A `build`
# cached against a config it never hashed would serve preferences projected from
# a topology the cache never looked at, which is the same defence `apps/home-web`'s
# `wrangler-validate` and `test` tasks already document in their own comments.
# `cache: false` on `build` is the honest answer under that constraint; the
# consuming web apps also gain a `deps` edge to this project, so ordering is
# still expressed where moon can see it.
#
# `frontend-support.json` at this project's root is GENERATED by
# `tooling/scripts/render-wrangler-config.mjs` from
# `infra-topology/frontend-support.json` and compared against it on every
# render. It is listed in `.prettierignore` so the renderer owns its bytes, and
# `tooling/scripts/check-frontend-config.mjs` fails the build when the two have
# drifted. It is NOT edited by hand.

tags:
  - frontend-preferences

tasks:
  format-check:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/prettier" --check --ignore-unknown --ignore-path "$MOON_WORKSPACE_ROOT/.prettierignore" --ignore-path "$MOON_WORKSPACE_ROOT/.gitignore" .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md}"
    outputs: []

  lint:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/eslint" .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue}"
    outputs: []

  typecheck:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "${FRONTEND_ENVIRONMENT:-development}" \
        --deployable home-web --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/tsc" --noEmit
    inputs:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "frontend-support.json"
      - "tsconfig.json"
    outputs: []

  test:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "${FRONTEND_ENVIRONMENT:-development}" \
        --deployable home-web --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/vitest" run
    inputs:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "frontend-support.json"
    outputs: []

  build:
    script: |
      set -eu
      cd "$MOON_PROJECT_ROOT"
      node "$MOON_WORKSPACE_ROOT/tooling/scripts/render-wrangler-config.mjs" \
        --stage offline --environment "${FRONTEND_ENVIRONMENT:-development}" \
        --deployable home-web --write
      "$MOON_PROJECT_ROOT/node_modules/.bin/tsc" -p tsconfig.build.json
    inputs:
      - "src/**/*.ts"
      - "frontend-support.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
    outputs:
      - "dist/**/*"
    options:
      cache: false
