# Moon configuration for the frontend-preferences package.
#
# This package owns preference MECHANICS for all frontend applications: locale
# detection and normalisation, the colour-mode attribute, display time-zone
# detection, the cookie policy, and the resolution order. It owns no translation
# catalog and no business or user data.
#
# See packages/frontend-preferences/README.md for the architecture and usage.
#
# A note on the missing `dist` input, because it is load-bearing rather than an
# oversight: `src/config.ts` imports `.generated/frontend/config.json`, which is
# gitignored and lives outside every project directory, so moon's `inputs:` cannot
# express it (moon 2.5.6 rejects `../x` outright — "parent directory traversal
# (..) is not supported"). A `build` cached against a config it never hashed would
# serve preferences projected from a topology the cache never looked at, which is
# the same defence `apps/home-web`'s `wrangler-validate` and `test` tasks already
# document in their own comments. `cache: false` on `build` is the honest answer
# under that constraint; the consuming web apps also gain a `deps` edge to this
# project, so ordering is still expressed where moon can see it.
#
# `frontend-support.json` at this project's root is GENERATED by
# `tooling/scripts/render-wrangler-config.mjs` from
# `infra-topology/frontend-support.json` and compared against it on every
# render. It is listed in `.prettierignore` so the renderer owns its bytes, and
# `tooling/scripts/check-frontend-config.mjs` fails the build when the two have
# drifted. It is NOT edited by hand.

tags:
  - frontend-preferences

tasks:
  format-check:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/prettier" --check --ignore-unknown .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue,json,jsonc,yml,yaml,md}"
    outputs: []

  lint:
    script: '"$MOON_WORKSPACE_ROOT/node_modules/.bin/eslint" .'
    inputs:
      - "**/*.{js,mjs,cjs,ts,vue}"
    outputs: []

  typecheck:
    script: 'cd "$MOON_PROJECT_ROOT" && "$MOON_PROJECT_ROOT/node_modules/.bin/tsc" --noEmit'
    inputs:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "frontend-support.json"
      - "tsconfig.json"
    outputs: []

  test:
    script: 'cd "$MOON_PROJECT_ROOT" && "$MOON_PROJECT_ROOT/node_modules/.bin/vitest" run'
    inputs:
      - "src/**/*.ts"
      - "tests/**/*.ts"
      - "frontend-support.json"
    outputs: []

  build:
    script: 'cd "$MOON_PROJECT_ROOT" && "$MOON_PROJECT_ROOT/node_modules/.bin/tsc" -p tsconfig.build.json'
    inputs:
      - "src/**/*.ts"
      - "frontend-support.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "package.json"
    outputs:
      - "dist/**/*"
    options:
      cache: false
