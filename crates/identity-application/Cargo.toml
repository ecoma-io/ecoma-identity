[package]
name = "identity-application"
description = "Use cases over the identity model: authentication, accounts, sessions, applications, administration, audit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The dependency law: this crate may name the domain and nothing else internal.
# It may NOT depend on identity-oidc, identity-security, identity-cloudflare or
# identity-testkit. The reason is structural, not stylistic: a use case that
# reached for the Cloudflare adapter or the TOTP implementation would be
# untestable without a platform, and the use-case layer is where the security
# decisions live. `tooling/scripts/check-architecture.mjs` judges this.
[dependencies]
identity-domain = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

# `serde_json` appears only in tests, and only because the "no account command
# carries an actor" test round-trips a command through JSON and asserts the
# resulting object has exactly the expected keys. A structural check needs a
# structural representation; a dev-dependency keeps the JSON machinery out of
# the production build of the use-case layer.
[dev-dependencies]
serde_json = { workspace = true }
