# Moonrepo workspace. Project discovery is an explicit map — nothing is
# inferred from globs, so a new module must be added here, to
# `module-boundaries.config.mjs`, and to `cocogitto.toml` in one commit.
#
# `toolchains.yml` pins Node and pnpm for moon tasks and CI; the Rust
# toolchain is the ambient stable toolchain (no rust-toolchain.toml by org
# convention), and Node/pnpm are pinned by .node-version and
# package.json#packageManager.
vcs:
  client: git
  defaultBranch: main

projects:
  # crates/
  identity-domain: crates/identity-domain
  identity-application: crates/identity-application
  identity-oidc: crates/identity-oidc
  identity-security: crates/identity-security
  identity-cloudflare: crates/identity-cloudflare
  identity-testkit: crates/identity-testkit
  # apps/
  identity-worker: apps/identity/worker
  identity-web: apps/identity/web
  identity-admin-worker: apps/identity-admin/worker
  identity-admin-web: apps/identity-admin/web
  identity-jobs-worker: apps/identity-jobs/worker
