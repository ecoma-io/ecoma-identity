    # rules live in repository settings, NOT in this file and NOT in any pull
    # request. This `environment:` key is the only thing in this repository
    # that makes the gate real; a comment above it would not be.
    #
    # ADR-0014 recorded this as "enforcement not yet built". It IS built: the
    # `production` environment exists with a required-reviewer rule and
    # `prevent_self_review`, recorded in `.github/repository-settings.json` and
    # verified live with `GET /repos/ecoma-io/ecoma-identity/environments`.
    #
    # What that means in practice, stated here rather than discovered at 50% of
    # production traffic: the named reviewer is the same person who pushes, and
    # `prevent_self_review` forbids them from approving their own deployment.
    # So this job will sit in `Waiting for approval` until a SECOND person is
    # added as a collaborator and a reviewer. That is the gate working, not the
    # gate broken — a single-maintainer repository cannot self-approve, and an
    # environment that let it would be the rubber stamp this key exists to avoid.
    environment: production
    permissions:
      contents: read
    outputs:
      percentage: ${{ steps.promote.outputs.percentage }}
    env:
      WORKER: ${{ inputs.worker }}
      LANE: ${{ inputs.lane }}
      WORKER_NAME: ${{ inputs.worker-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION_ID: ${{ needs.build_and_upload.outputs.version-id }}
      POLICY_LIMIT_PERCENTAGE: ${{ inputs.policy-limit-percentage }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # NO CHECKOUT, and this job does not build — a promotion names an
      # already-uploaded Version, and the guarantee it relies on is that the
      # bytes it sends traffic to are the bytes that were canaried and
      # smoke-tested. No `moon run`, no `pnpm build`, no cargo, no web app:
      # building here would make every promotion a rebuild (ADR-0013), and a
      # checkout that produces no build is ~40 seconds and ~1,400 packages
      # spent so one wrangler command can resolve out of `node_modules`.
      #
      # The toolchain is read from the API at `main` and wrangler comes from
      # the npm registry at the pinned version, which is how `rollback.yml`
      # already runs and the only spelling that works with no `node_modules`.
      # `WRANGLER_BIN` is what `wrangler-step.sh` executes; it defaults to
      # `pnpm exec wrangler` where there IS a checkout and is set here because
      # there is not.
      - name: Read the repository's pinned toolchain from the API (no checkout)
