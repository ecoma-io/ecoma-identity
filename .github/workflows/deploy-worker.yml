name: deploy-worker

# REUSABLE: build, upload, smoke test and PROMOTE one Cloudflare Worker
# Version. Called by `deploy.yml` (staging, every merge to main) and by
# `deploy-production.yml` (on a release tag), and it is where the two commands
# that must never be confused are kept apart:
#
#   wrangler versions upload                                  -> creates a Version. NO traffic.
#   wrangler versions deploy --version-id <id> --percentage <p> -> creates a Deployment. Traffic moves.
#
# The four stages, and the order `needs` enforces rather than the order they are
# written in:
#
#   1. build_and_upload      upload only; never moves traffic
#   2. smoke                 the version must answer the contract ITS deployable
#                            declares: /health and /ready for an Identity Worker,
#                            the landing page and a generated asset for home-web
#   3. canary                1% -> 10%, with a health gate between (automatic)
#   4. promote_to_*          the final percentage — 50% and 100% each behind
#                            their own `environment: production` approval
#
# ---------------------------------------------------------------------------
# FOUR DEPLOYABLES, THREE SHAPES, ONE PIPELINE
# ---------------------------------------------------------------------------
# `home-web` (ADR-0016) is the fourth deployable and the first one that is not
# an Identity Worker: a Nuxt/Nitro application uploaded to Workers + Assets
# rather than a Rust Worker compiled to wasm. Three steps in this file therefore
# branch on the deployable instead of deriving behaviour from the component
# name, and each branch says which deployable it is for:
#
#   the Rust toolchain       Identity Workers only; home-web has no crate
#   the build step           `identity`/`identity-admin` build a SPA first;
#                            `identity-jobs` builds the Worker alone;
#                            `home-web` runs `moon run home-web:package` alone
#   the smoke test           /health + /ready, or `/` plus a `/_nuxt/` asset
#
# The derived convention this file used to apply — "every deployable except
# identity-jobs has a `@ecoma-io/<component>-web` SPA" — was true only because
# every deployable happened to be an Identity Worker. Deriving it from the
# component name meant a fourth deployable inherited a frontend it does not
# have, and the deploy failed at `pnpm --filter` on a package that was never
# going to exist. An explicit case fails closed at review time instead.
#
# Everything else — the generated config copy, the dry run, the immutable
# `wrangler versions upload --no-bundle`, the version-id lookup, the promotion
# jobs and the `always()` cleanup — is SHARED, because those steps concern a
# Cloudflare Version rather than a language or a framework.
#
# ADR-0013 makes that separation a constraint on the SHAPE of this file, not a
# habit: the upload step and every promotion step are separate steps, the
# version id is captured between them and passed by name, and there is no code
# path in this file that builds and promotes in one step. A version that was
# uploaded and never promoted serves nothing, costs nothing and is still there —
# which is what makes abandoning a failed canary non-destructive.
#
# NO STEP IN THIS FILE CHECKS OUT, BUILDS, TESTS OR PACKAGES ANYTHING DURING A
# ROLLBACK, because a rollback does not come through here. It comes through
# `rollback.yml`, whose entire job is the other two commands. If you are reading
# this file during an incident looking for a way to build, you are in the wrong
# file, and the reason is ADR-0013: a rebuild is a forward fix, it takes minutes
# during which the bad version keeps serving, and it re-runs the pipeline you
# least trust.
#
# ---------------------------------------------------------------------------
# WHAT A GREEN RUN OF THIS WORKFLOW DOES AND DOES NOT MEAN
# ---------------------------------------------------------------------------
# It means: a Worker was built from a named commit, uploaded as an immutable
# Version, smoke-tested, and sent a stated percentage of traffic.
#
# It does NOT mean an authentication service works. At platform bootstrap the
# three Worker composition roots are one-line placeholders (`docs/README.md`,
# "The three Worker composition roots — DEFERRED"), so a version built today
# serves no protocol route at all and the smoke test below is written to expect
# exactly that. The smoke test is therefore NOT an assertion that the Worker
# serves requests; it is an assertion that the version is reachable and that it
# answers the way THIS repository's own route table says it answers. When a
# Worker gains a real /health and /ready, this check starts asserting their
# content too, and that is the change to make in the same commit that makes the
# routes answer.
#
# A check that cannot run exits non-zero. There is no "skip the smoke test until
# the Worker exists" branch in this file, and adding one would produce a green
# run meaning nothing at all.

on:
  workflow_call:
    inputs:
      # The wrangler worker name, which is also the moon project id, the
      # release-please component and the git tag prefix. One string, four
      # meanings, deliberately: a tag, a version id and a worker name that can
      # be compared by eye are worth more than a consistent naming scheme that
      # includes the language a project happens to be written in.
      #
      # "the moon project id" rather than "an alias for it", which is what this
      # said until the staging deploy failed at `moon run "$WORKER:package"`
      # with `project_graph::unknown_id`. The three names used to be aliases
      # declared in the root `moon.yml`, which moon 2.5.6 does not implement;
      # the deployables are now REGISTERED under these names in
      # `.moon/workspace.yml`. If you ever see a moon project id spelled
      # `identity-worker`, that is the crate name and no command will resolve it.
      #
      # `home-web` (ADR-0016) is registered in the same file and matches the
      # same three rules, and it is NOT an Identity Worker — see the header on
      # what branches on it. The list is spelled out because GitHub Actions has
      # no enum input type: a `choice`-shaped description is the only
      # enumeration available, so it has to be the complete one.
      worker:
        description: "Repository component name (identity | identity-admin | identity-jobs | home-web): the moon project id, the config directory, and the release tag prefix"
        required: true
        type: string

      # The Cloudflare SCRIPT name, which is NOT always the component name.
      # Production and development use `identity`; staging uses
      # `identity-staging`, `identity-admin-staging` and `identity-jobs-staging`
      # (see `environments.*.resources.*.worker` in
      # `infra-topology/topology.json`). The
      # suffix is what stops a staging deploy from overwriting production's
      # default environment, and it is why this cannot be derived from
      # `worker` inside this file.
      #
      # `--name "$WORKER_NAME"` is how every promotion names the Worker it
      # creates a Deployment against, so getting this wrong promotes the wrong
      # environment — which is why it is a required input with no default
      # rather than a computed value. The caller reads it off the config.
      worker-name:
        description: "Cloudflare Worker script name, e.g. identity or identity-staging"
        required: true
        type: string

      # `development` | `staging` | `production` — the block of
      # `infra-topology/topology.json` describing this environment, and the
      # subdirectory the renderer writes it to.
      environment:
        description: "topology environment to deploy"
        required: true
        type: string

      # The git tag that triggered this run, e.g. `identity-v0.1.0`. This is
      # the version's identity: it becomes the Cloudflare Version tag, so
      # "which version had tag X" is a lookup rather than an inference, and a
      # rollback decision is decidable (docs/operations/deployment-model.md).
      tag:
        description: "The release tag being deployed (becomes the Cloudflare Version tag)"
        required: true
        type: string

      # The lane name, recorded in every run summary so a person reading a log
      # during an incident knows which environment a run touched without
      # inferring it from the Worker name.
      #
      # It is a free string rather than an enum because GitHub Actions has no
      # enum input type, and a `choice`-shaped input that silently accepted any
      # string anyway would be a fake constraint. It does NOT select
      # credentials — the caller passes `secrets:` explicitly, which is what
      # actually stops a staging run from holding the production token
      # (`docs/security/secrets-management.md`: a staging token must not be able
      # to write to production).
      #
      # It used to claim it prefixed the secret names. It does not, and a
      # required input that nothing reads is worse than no input: it looks like
      # a control and is not one.
      lane:
        description: "Lane name, recorded in the run summary (staging | production)"
        required: true
        type: string

      # Canary ladder for `identity`; ignored for the other two. The caller
      # passes the percentages it wants WALKED, and this file does not promote
      # past `requires-approval` without the approval — the steps that need it
      # are the ones carrying `environment: production`, which is a gate the
      # runner refuses to pass without a named approver, not an `if:` somebody
      # can delete in the same pull request.
      #
      # Empty for admin and jobs, whose entire ladder is 100% (ADR-0014
      # constraint 20: they are not on the end-user request path, and their
      # smoke test is their gate).
      #
      # A JSON ARRAY AS A STRING, not `type: array` — GitHub Actions does not
      # have one. `workflow_call` inputs are `boolean | number | string`, and
      # an actionlint run against this organisation's other reusable workflows
      # says so at the definition rather than at the call site, which is the
      # place it is cheapest to find. `[]` therefore means "no ladder" and
      # `[1, 10]` means 1% then 10%.
      canary:
        description: "JSON array of traffic percentages to walk, e.g. [1,10] (identity only; [] = straight to the final percentage)"
        required: false
        default: "[]"
        type: string

      # The first percentage that needs a human. 50 for `identity` in
      # production (ADR-0014); unused for everything else.
      #
      # It is a separate input rather than the second element of `canary`
      # because it belongs to a DIFFERENT KIND of step: the canary ladder runs
      # on this file's own judgement, while this percentage runs on somebody
      # clicking Approve. Putting an approval-gated percentage in the same array
      # as the automatic ones would make the boundary a matter of array
      # ordering, and array ordering is exactly the thing a later commit
      # rewrites without noticing what it changed.
      policy-limit-percentage:
        description: "First percentage that requires a production-environment approval (50 for identity; unused otherwise)"
        required: false
        default: 0
        type: number

      # The percentage this call ends at. 100 for everything, and for `identity`
      # in production it is the SECOND human gate — the 100% job waits on the
      # 50% job, so approving 50% is not approving 100% (ADR-0014 step 7).
      final-percentage:
        description: "Traffic percentage to end at"
        required: true
        type: number

      # Whether a human approves the FINAL step. True only for `identity` in
      # production, and the approval is enforced by the `environment:`
      # key on the job below — the input is here so the caller's intent is
      # visible in one place rather than inferred from which steps ran.
      requires-approval:
        description: "Final promotion requires approval on the production environment"
        required: false
        default: false
        type: boolean

      # Cloudflare resource ids, placeholder token -> real value, substituted
      # into the generated config copy.
      #
      # KEPT, AND IT IS ON THE LIST TO DELETE. The config the renderer produces
      # resolves D1, KV and queue ids by exact logical name against the
      # Cloudflare API, so after Phase 3 nothing needs a value passed in here:
      # `reconcile-infra.mjs` writes a descriptor and the renderer consumes it.
      #
      # Until then the placeholder mechanism is still the only thing that makes
      # these ids available at all, and removing it without replacing it would
      # leave a production deploy binding to literally nothing. The two steps
      # are one change and Phase 3 makes both.
      #
      # A JSON OBJECT AS A STRING, for the same reason `canary` is one:
      # `workflow_call` has no `object` input type.
      injections:
        description: "JSON object of placeholder token -> replacement value, applied to the generated config copy only"
        required: false
        default: "{}"
        type: string

      # The public host the `home-web` smoke test probes, for THIS lane —
      # `HOME_WEB_STAGING_SMOKE_PROBE_BASE_URL` in staging and
      # `HOME_WEB_PRODUCTION_SMOKE_PROBE_BASE_URL` in production, passed
      # through from `vars` by the caller rather than read from this file's own
      # namespace.
      #
      # WHY IT IS AN INPUT AND NOT A REPOSITORY VARIABLE READ HERE. The Identity
      # Workers read `vars.SMOKE_PROBE_BASE_URL` directly, and a single variable
      # is the right shape for one deployable: there is one Identity host per
      # lane. There are now TWO deployables with a public host per lane, so
      # reading one namespace would send home-web's landing-page check to
      # whatever host Identity is deployed on. That check would then report a
      # green run for a public site it never touched, which is the specific
      # falsehood this repository's honesty rule exists to prevent.
      #
      # WHY IT IS NOT A DEFAULT. An empty default that falls back to
      # `SMOKE_PROBE_BASE_URL` is the same bug wearing a disguise. It fails
      # loudly instead: an Identity caller leaves it empty and is unaffected; a
      # `home-web` caller that has not configured its own host gets a non-zero
      # exit and a message naming the variable to set.
      #
      # It is not validated as a URL here. What consumes it validates it, and
      # `workflow_call` has no way to fail at definition time anyway — so the
      # honest place for that check is the step that would be misled by a
      # malformed value.
      home-smoke-base-url:
        description: "Public base URL of the home-web deployment in this lane, e.g. the value of HOME_WEB_STAGING_SMOKE_PROBE_BASE_URL; required for home-web, ignored for the Identity Workers"
        required: false
        default: ""
        type: string

    secrets:
      # THE ONLY Cloudflare credential this repository holds. One account, one
      # token; environment isolation comes from resource naming, the topology
      # checker and API-token scope — never from separate tokens or separate
      # accounts (`infra-topology/topology.json`, `account.$comment`).
      #
      # It is what `docs/security/secrets-management.md` rates as "deploy
      # arbitrary code to production, which is arbitrary code execution" if
      # leaked.
      CLOUDFLARE_API_TOKEN:
        description: "Cloudflare API token for the lane named in `lane`"
        required: true

    outputs:
      version-id:
        description: "The Cloudflare Version id that was uploaded (and, if promoted, promoted)"
        value: ${{ jobs.build_and_upload.outputs.version-id }}
      # Both promotion variants report `percentage`, and BOTH have to be read:
      # `promote_to_final.outputs` is an empty string on the approval path, and
      # an output that silently reads empty on half the runs is a caller that
      # learns to ignore it.
      final-percentage:
        description: "The traffic percentage this call actually ended at"
        value: ${{ jobs.promote_to_final.outputs.percentage || jobs.promote_to_full_percentage.outputs.percentage }}

# `permissions: contents: read` is the only grant this workflow needs as a
# whole. It is the workflow-level default, which matters because four of the
# six jobs now carry NO job-level block and therefore inherit exactly this:
#
#   * `build_and_upload` — has a checkout and builds, but writes nothing.
#   * `canary`, `promote_to_final`, `promote_to_policy_limit`,
#     `promote_to_full_percentage` — no checkout at all. They read `.node-version`,
#     `package.json` and `infra-topology/topology.json` through the contents API,
#     which this grant authorises, and read nothing else from the repository.
#   * `smoke` — calls no API and reads no file. It holds no `permissions` block
#     because it needs no grant: it curls a public host over HTTPS. It is the
#     only job here with no repository access of any kind, which is the correct
#     posture for a job that asserts what a deployed host serves.
#
# Nothing here writes to the repository, opens a pull request, or pushes a tag:
# a deploy that also pushed would be a release (ADR-0012), and those are two
# acts.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 of 4: build, then upload. This job's last command is
  # `wrangler versions upload`, which sends NO TRAFFIC — ever — and the job
  # says so in its own summary so a reader who lands here does not have to know
  # that to find out. Everything downstream depends on the version id it
  # outputs, and no promotion can happen without one (ADR-0012 step 5: there is
  # no path that builds and promotes in one step, because that path would make
  # every promotion a rebuild and destroy the meaning of a version id).
  # ---------------------------------------------------------------------------
  build_and_upload:
    name: Build and upload ${{ inputs.worker }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      # The Version id, read back from Cloudflare by the tag we just applied
      # rather than scraped from wrangler's log line. `wrangler versions
      # upload` has no `--json`; it prints `Worker Version ID: <id>` on stdout
      # among colour codes and timing output. `wrangler versions list --json`
      # DOES emit structured output — an array whose elements carry `id`,
      # `metadata.created_on` and `annotations["workers/tag"]` — so resolving
      # the id by tag is both unambiguous and the same lookup an operator does
      # when they need to roll back (docs/operations/rollback.md, "The version
      # that carried a known-good tag").
      version-id: ${{ steps.resolve.outputs.version-id }}
    env:
      WORKER: ${{ inputs.worker }}
      LANE: ${{ inputs.lane }}
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_TAG: ${{ inputs.tag }}
      # wrangler reads the token from the environment. Passed through `env`
      # rather than a `--var` so the token never appears in a command line, in
      # a process listing, or in a log line.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ---- the Cloudflare account id -------------------------------------
      # Read from `infra-topology/topology.json`, which pins it, and written to
      # `$GITHUB_ENV` so every later step in this job has it.
      #
      # IT WAS A SECRET, AND IT WAS A SECRET THAT DOES NOT EXIST. This job
      # used to read `secrets.CLOUDFLARE_ACCOUNT_ID`; that name is defined in
      # no repository and no organisation, so the variable resolved to the empty
      # string and wrangler refused to authenticate — reporting
      #
      #     In a non-interactive environment, it's necessary to set a
      #     CLOUDFLARE_API_TOKEN environment variable
      #
      # which names the WRONG credential. The token was present and correct the
      # whole time; the account id was the missing half, and wrangler's message
      # points at the other one. Twenty staging deploys failed this way.
      #
      # `topology.json` says it outright: "The three GitHub Secrets that used
      # to carry per-lane copies of it are gone; every workflow reads this value
      # from this file." Nothing did. This step is that reading.
      #
      # Why the file and not a variable: `docs/security/secrets-management.md`
      # lists the account id as "pinned in the topology; read by the tooling,
      # never by a secret or a variable", so a secret was a second source of
      # truth that did not exist, and a variable would be one that can drift.
      # A public identifier that names the account rather than anything inside
      # it, read from the file that owns it.
      #
      # It does not echo the id. It does not need to, and a value an operator
      # can read from a config file they can already read is a value that
      # belongs in no log.
      - name: Read the Cloudflare account id from the topology
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(jq -er '.account.id | select(type == "string" and length > 0)' \
            infra-topology/topology.json)" \
            || { echo "::error::infra-topology/topology.json declares no usable account.id. Every wrangler command in this job needs it, and there is nowhere else to read it from."; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare account id read from infra-topology/topology.json"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The wasm target is named explicitly rather than left to whatever the
      # image ships, because a runner whose default host target happened to
      # match would build a native binary that wrangler then refuses to upload —
      # and the failure would read as a config error rather than a missing
      # target. No `rust-toolchain.toml` exists in this repository by org
      # convention: the ambient stable toolchain IS the toolchain, and the MSRV
      # is enforced by `rust-version` in the workspace Cargo.toml.
      #
      # NOT INSTALLED FOR `home-web`. ADR-0016 makes home-web a Nuxt/Nitro
      # application with no crate, and there is no `apps/home-web/worker/` to
      # compile — so a Rust toolchain here would install ~200MB, warm a cargo
      # cache that nothing reads, and, worse, imply that home-web is a Rust
      # deployable in the one place a reader is checking exactly that. The
      # guard is the component name for the same reason the build step below
      # is: three shapes, one list of names, checked at review time.
      - name: Set up the Rust toolchain (Identity Workers only)
        if: inputs.worker != 'home-web'
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache the Rust build (Identity Workers only)
        if: inputs.worker != 'home-web'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build through the task graph, never through `wrangler deploy` or a
      # direct cargo invocation: CI and a laptop then produce the same artifact
      # from the same task, and the moon project that owns a task is the moon
      # project that answers for it.
      #
      # `package`, not `build`: the per-Worker `package` task is the release
      # wasm artefact (`cargo build --release --target wasm32-unknown-unknown`),
      # and a version that gets promoted must be the release build, not a debug
      # one. `build` is the same target without `--release`.
      #
      # The web app is built FIRST and deliberately by name. `assets.directory`
      # points the Worker at `apps/<app>/web/dist`, so a version built before
      # the SPA exists is a version that serves an API and no UI — a half of
      # the release unit ADR-0015 says may not exist. `identity` ships the
      # end-user SPA and `identity-admin` the operator console; `identity-jobs`
      # has no frontend, and asking for one it does not have is a typo, not a
      # no-op.
      #
      # A moon task, because both web apps have their own `moon.yml` now. The
      # reason it is one rather than `pnpm --filter` is recorded on the same
      # line in ci.yml, and it applies here with more force: `identity-web:build`
      # carries `deps: ["^build"]`, which is what compiles
      # `@ecoma-io/shared-i18n`. Without it a deploy runs on a clean runner
      # where that package's gitignored `dist/` does not exist, and the build
      # dies on `Rolldown failed to resolve import "@ecoma-io/shared-i18n"` —
      # after two approvals, at whatever hour the promotion was run.
      #
      # ---- `home-web` (ADR-0016) ------------------------------------------
      # The third case, and the reason the first two are not derived from the
      # component name. home-web is a Nuxt/Nitro application: its release
      # artefact is the `.output/` tree that `home-web:package` builds and
      # verifies, and there is no Rust Worker and no separate SPA to build
      # before it. So the SPA branch is skipped and exactly one moon task runs.
      #
      # What home-web must NOT do here is inherit the `@ecoma-io/<component>-
      # web` convention: `@ecoma-io/home-web-web` is not a package, and a
      # `pnpm --filter` on a name that resolves to nothing fails the deploy
      # before a version exists. The `case` also turns an unknown component
      # into a loud failure rather than a deploy that quietly built nothing and
      # uploaded whatever the previous step left behind.
      - name: Build the release unit (one deployable, one artefact)
        env:
          # An explicit `case` on a validated list, rather than the boolean
          # chain this used to derive. GitHub Actions has no `switch`, so the
          # shell is where the three shapes have to be spelled out — and a
          # shell `case` with a `*)` arm that exits non-zero is the only version
          # of this that fails closed on a fifth deployable.
          #
          # Each arm echoes what it is about to build, so a run summary says
          # which shape ran without anybody reading the branch.
          IS_HOME_WEB: ${{ inputs.worker == 'home-web' && 'true' || 'false' }}
          HAS_WEB_APP: ${{ inputs.worker != 'identity-jobs' && inputs.worker != 'home-web' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          case "$WORKER" in
            home-web)
              echo "home-web is a Nuxt/Nitro application (ADR-0016) — building .output/ only, no Rust Worker and no separate SPA."
              pnpm exec moon run home-web:package
              ;;
            identity|identity-admin|identity-jobs)
              if [ "$HAS_WEB_APP" = "true" ]; then
                pnpm exec moon run "$WORKER-web:build"
              else
                echo "::notice::$WORKER ships no frontend (ADR-0015) — building the Worker only."
              fi
              pnpm exec moon run "$WORKER:package"
              ;;
            *)
              echo "::error::unknown deployable '$WORKER'. This workflow deploys identity, identity-admin, identity-jobs and home-web — a fifth needs an ADR and a case in this file, per ADR-0002 as amended by ADR-0016."
              exit 1
              ;;
          esac

      # ---- the generated config copy -------------------------------------
      # Never committed, never uploaded as an artefact. It exists only for the
      # lifetime of this job, in the runner's temp directory, and it is the
      # only place a real Cloudflare id ever appears (constraint 27). The
      # substitution is a literal `PLACEHOLDER` -> value replacement over the
      # text, deliberately NOT a JSON re-serialisation: the tracked configs are
      # JSONC with comments that carry the boundary rules as data, and parsing
      # and re-emitting them would strip the very comment that says "there is
      # no `d1_databases` block here, and adding one needs an ADR".
      #
      # The script exits non-zero if a declared placeholder is still present
      # after substitution, and also if the result is not loadable by wrangler.
      # A config that silently kept a `PRODUCTION_...` token would upload bytes
      # bound to nothing and then get promoted, and the failure would surface
      # as a Worker that serves errors at 100% of production traffic.
      - name: Render the wrangler config from the topology
        env:
          INJECTIONS_JSON: ${{ inputs.injections }}
          ENVIRONMENT: ${{ inputs.environment }}
          DEPLOYABLE: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          # There is no tracked config to copy. `pnpm infra:render` projects
          # infra-topology/topology.json into this lane's directory, and wrangler
          # resolves `main` and `assets.directory` relative to the config it is
          # given — so the renderer already writes them relative to the repo
          # root and the file has to stay where it was put.
          #
          # `--stage resolve`, NOT `--stage offline`, and this is the single most
          # consequential line in this file.
          #
          # `offline` is the SHAPE check: it emits `UNRESOLVED_SENTINEL` for every
          # id it cannot resolve without credentials, which is what `pnpm arch`
          # and `moon run :wrangler-validate` consume in CI. Uploading that is
          # a deploy bound to nothing — wrangler sends
          # `UNRESOLVED_REQUIRES_CLOUDFLARE_CREDENTIAL` as a D1 `database_id`
          # and Cloudflare answers "no such database".
          #
          # This job UPLOADS, so it needs `resolve`: `reconcile-infra.mjs` asks
          # Cloudflare for each id by the exact name topology declares, writes an
          # ephemeral descriptor to the runner's temp directory, and the renderer
          # reads it. Nothing is committed and nothing is carried across jobs, so
          # replacing a database is a no-op for this repository — the next run
          # asks again and gets the new one.
          #
          # `--stage offline` is what every staging deploy used, which is why
          # none of them ever created a version.
          node tooling/scripts/reconcile-infra.mjs \
            --environment "$ENVIRONMENT" \
            --out "$RUNNER_TEMP/descriptor.json"
          node tooling/scripts/render-wrangler-config.mjs \
            --stage resolve \
            --descriptor "$RUNNER_TEMP/descriptor.json" \
            --environment "$ENVIRONMENT" \
            --deployable "$DEPLOYABLE" \
            --out-dir ".generated" \
            --write
          CONFIG_DIR=".generated/cloudflare/$ENVIRONMENT/$DEPLOYABLE"
          GENERATED="$CONFIG_DIR/wrangler.jsonc"

          if [ "$INJECTIONS_JSON" != "{}" ] && [ -n "$INJECTIONS_JSON" ]; then
            python3 - "$GENERATED" "$INJECTIONS_JSON" <<'PY'
          import json, sys
          path, raw = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          for placeholder, value in json.loads(raw).items():
              if not isinstance(value, str) or not value:
                  # An empty value would leave a syntactically valid config
                  # with an empty id, which Cloudflare accepts and which
                  # points at nothing. Refusing here is the difference between
                  # a failed deploy and a deployed Worker bound to a blank.
                  sys.exit(f"::error::no value supplied for placeholder {placeholder!r}")
              text = text.replace(placeholder, value)
          leftovers = sorted(
              w for w in text.replace('"', " ").replace(",", " ").split()
              if w.isupper() and w.startswith(("PRODUCTION_", "STAGING_", "DEVELOPMENT_"))
          )
          if leftovers:
              sys.exit("::error::unsubstituted placeholders remain: " + ", ".join(leftovers))
          open(path, "w", encoding="utf-8").write(text)
          print("injected and verified")
          PY
          else
            echo "::notice::no injections for this lane; the rendered config declares no unresolved id."
          fi

          # `wrangler deploy --dry-run` compiles and runs wrangler's own
          # validation against the generated copy WITHOUT uploading and
          # WITHOUT changing any traffic. If the config is unreadable or
          # inconsistent, this fails here — before a version exists — rather
          # than at a promotion two approvals later.
          bash tooling/scripts/wrangler-step.sh "dry-run the generated config" -- \
            deploy --dry-run -c "$GENERATED" || {
            echo "::error::the generated wrangler config did not pass wrangler's own validation."
            exit 1
          }

      # ---- the migrations --------------------------------------------------
      # BEFORE the upload, because the version being uploaded must be a version
      # that works against the schema it will meet in production. Applying
      # afterwards would mean promoting bytes onto a database that does not yet
      # have the tables those bytes read.
      #
      # WHY THE BINDING AND NOT A NAME. Wrangler's positional argument is matched
      # against `database_name` or `binding` by strict equality, and a UUID is
      # REJECTED. The binding is read out of the config just rendered rather than
      # hardcoded here, so a topology that renames the slot changes this step too,
      # and a deployable that declares no D1 skips the step entirely rather than
      # failing on a binding that is not there. `IDENTITY_DB` is what
      # infra-topology/topology.json says today; nothing in this file repeats it
      # as a fact.
      #
      # WHY `--remote` IS LOAD-BEARING. `wrangler d1 migrations apply` DEFAULTS
      # TO LOCAL. Without `--remote` it creates a sqlite file under
      # `.wrangler/state`, applies every migration to it, prints success and
      # exits 0. A green run having changed nothing is worse than a red one,
      # because the red one is visible and this one is not. There is also no
      # `--yes` on this command; it skips its confirmation prompt automatically
      # when stdin is not a terminal, which is what a workflow step is.
      #
      # WHY ONE MIGRATION RUN PER DEPLOY IS SAFE TODAY, AND WHAT WOULD BREAK IT.
      # `database/identity/migrations/0001_schema_migrations.sql` records that
      # this repository keeps its own schema-version table ALONGSIDE wrangler's
      # `d1_migrations` ledger, and topology sets `migrations_table:
      # "d1_migrations"` so the two do not diverge. That ledger is a table in one
      # database, so two concurrent applies against the same database race on it.
      # Only `identity` declares a D1 (ADR-0003), the four staging jobs run in
      # parallel, and their resource sets are disjoint — `identity` owns the D1
      # and `jobs` owns its own KV — so no two jobs touch one database. The
      # assertion below is what keeps that a checked property rather than a
      # coincidence of this topology: if two jobs ever target the same database,
      # the run stops here instead of racing wrangler's ledger.
      - name: Apply D1 migrations
        id: migrate
        env:
          CONFIG_PATH: .generated/cloudflare/${{ inputs.environment }}/${{ inputs.worker }}/wrangler.jsonc
        run: |
          set -euo pipefail

          # READ TOPOLOGY, NOT THE GENERATED CONFIG. Both were tried; topology is
          # the right one for three reasons.
          #
          # The generated config is JSONC: it carries `//` boundary comments and
          # a trailing comma, so neither `jq` nor Python's `json` parses it.
          # Stripping comments with `sed` is worse than a parse error — every
          # config contains an issuer URL, so `"https://stg-identity.ecoma.io"`
          # loses its `//` and the string is cut in half. Parsing it properly
          # means a JSONC reader in a workflow step, which is a second
          # implementation of a format `render-wrangler-config.mjs` already owns.
          #
          # Topology is plain JSON, it is the file the renderer projects FROM, and
          # it declares both halves of what this step needs: the binding slot
          # name (`bindings.<deployable>.d1`) and the resource name
          # (`environments.<env>.resources.<deployable>.d1.name`). Reading both
          # from one jq call means they cannot be from different places, and a
          # deployable that declares no D1 is answered by the same read.
          read -r D1_BINDING D1_NAME < <(jq -r \
            --arg env "$ENVIRONMENT" --arg w "$WORKER" '
              [ (.bindings[$w].d1 // ""),
                (.environments[$env].resources[$w].d1.name // "") ]
              | @tsv' infra-topology/topology.json)

          if [ -z "$D1_BINDING" ] || [ -z "$D1_NAME" ]; then
            echo "::notice::$WORKER declares no d1_databases binding in $ENVIRONMENT. Nothing to migrate."
            echo "migrated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Applying migrations to the database bound as $D1_BINDING (remote)."
          echo "  database_name: $D1_NAME"

          # The ledger is per-database and the parallel jobs are per-deployable,
          # so the invariant to check is that this database is this deployable's
          # alone. Derived from topology, not asserted in prose.
          CONCURRENT="$(jq -r --arg env "$ENVIRONMENT" --arg n "$D1_NAME" '
            [.environments[$env].resources
             | to_entries[]
             | select(.value.d1.name == $n)
             | .key] | join(",")' infra-topology/topology.json)"
          if [ "$CONCURRENT" != "$WORKER" ]; then
            echo "::error::the database $D1_NAME is declared by [$CONCURRENT], but this job is deploying $WORKER. Two jobs applying migrations to one database race on wrangler's d1_migrations ledger. Split the resource out or run the deploys serially; do not let them run in parallel."
            exit 1
          fi

          bash tooling/scripts/wrangler-step.sh "apply d1 migrations" -- \
            d1 migrations apply "$D1_BINDING" \
            --remote \
            --config "$CONFIG_PATH"

          echo "migrated=true" >> "$GITHUB_OUTPUT"
          {
            echo "### D1 migrations applied"
            echo ""
            echo "- Worker: \`$WORKER\`"
            echo "- Environment: \`$ENVIRONMENT\`"
            echo "- Binding: \`$D1_BINDING\` → \`$D1_NAME\`"
            echo "- Ledger: \`d1_migrations\` (wrangler's own; this repository's"
            echo "  \`schema_migrations\` table coexists with it by design — see"
            echo "  \`database/identity/migrations/0001_schema_migrations.sql\`)"
            echo ""
            echo "Forward-only under ADR-0011: a migration may add, never remove"
            echo "or narrow, and wrangler never down-migrates."
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- the upload ------------------------------------------------------
      # THE COMMAND THAT CREATES A VERSION AND SENDS NO TRAFFIC. Not
      # `wrangler deploy`, which creates a Deployment and immediately sends
      # 100% of traffic — the one command in this file that would put an
      # unreviewed binary on the production request path.
      #
      # `--tag` is the git tag, which is the whole traceability story: a
      # version's Cloudflare tag is its git tag, so "which version had tag X"
      # is a lookup and a rollback decision is decidable. `--message` carries
      # the same string plus the commit, so the version describes itself in the
      # Cloudflare dashboard without a git checkout.
      #
      # `--no-bundle` is load-bearing. The build already happened through moon
      # in the step above; without it wrangler would run the config's
      # `build.command` a second time — a `cargo install` plus a fresh
      # `worker-build --release` — producing a SECOND set of bytes from the
      # same source, and uploading the one nobody reviewed. The bytes that get
      # promoted must be the bytes that got tested.
      - name: Upload a version (NO TRAFFIC)
        id: upload
        env:
          CONFIG_PATH: .generated/cloudflare/${{ inputs.environment }}/${{ inputs.worker }}/wrangler.jsonc
        run: |
          set -euo pipefail
          bash tooling/scripts/wrangler-step.sh "upload a version" -- versions upload \
            --config "$CONFIG_PATH" \
            --no-bundle \
            --tag "$RELEASE_TAG" \
            --message "$RELEASE_TAG ($GITHUB_SHA) uploaded by .github/workflows/deploy-worker.yml"
          {
            echo "### Uploaded a version — no traffic was sent"
            echo ""
            echo "A Cloudflare **Version** now exists. Nothing serves it yet."
            echo "Promoting it is a separate act, below and in the promotion jobs,"
            echo "and a version that is uploaded and never promoted is the normal"
            echo "state of a version that failed its smoke test."
            echo ""
            echo "- Worker: \`$WORKER\`"
            echo "- Environment: \`$ENVIRONMENT\` (lane \`$LANE\`)"
            echo "- Version tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Resolve the Version id from the tag, as documented above.
      - name: Resolve the version id from its tag
        id: resolve
        run: |
          set -euo pipefail
          JSON="$(bash tooling/scripts/wrangler-step.sh "list versions" -- versions list \
            --config ".generated/cloudflare/$ENVIRONMENT/$WORKER/wrangler.jsonc" \
            --json --)"
          VERSION_ID="$(printf '%s' "$JSON" | python3 -c '
          import json, sys
          tag = sys.argv[1]
          versions = json.load(sys.stdin)
          for version in versions:
              annotations = version.get("annotations") or {}
              if annotations.get("workers/tag") == tag:
                  print(version["id"])
                  break
          ' "$RELEASE_TAG")"
          if [ -z "$VERSION_ID" ]; then
            echo "::error::no uploaded version carries the tag $RELEASE_TAG. The upload step reported success, so this is a version-listing problem rather than a build problem — and the run is failing rather than proceeding with an empty id."
            exit 1
          fi
          echo "version-id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved $RELEASE_TAG -> $VERSION_ID"
          {
            echo ""
            echo "- Version id: \`$VERSION_ID\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The generated copy carries real Cloudflare ids. Deleting it in the same
      # job means it never reaches the runner's artefact upload, the runner's
      # cache, or a post-job shell history — and `always()` is correct here
      # because the copy exists from the moment it is written, so a failure
      # between writing it and reaching this step is exactly when leaving it
      # behind would matter.
      - name: Delete the generated config copy
        if: always()
        run: rm -rf ".generated/cloudflare/$ENVIRONMENT/$WORKER"

  # ---------------------------------------------------------------------------
  # Stage 2 of 4: the automatic canary ladder, walked one percentage at a time.
  #
  # The first job in this file that can change what a Worker serves, and
  # every step in it is `wrangler versions deploy --version-id <id>
  # --percentage <p>` — never a build. A failed ladder is abandoned by
  # promoting a different version id, and an uploaded-but-not-promoted version
  # costs nothing and is still there (ADR-0013).
  # ---------------------------------------------------------------------------
  canary:
    name: Canary ${{ inputs.worker }} (${{ inputs.environment }})
    # No canary steps for the direct-to-100% lane. `identity-admin` and
    # `identity-jobs` are uploaded, smoke tested and promoted at 100% with no
    # manual approval at any point (ADR-0014 constraint 20), and a job named
    # "Canary" that runs zero steps would be a name claiming a ladder that
    # does not exist.
    #
    # `fromJson(inputs.canary) != fromJson('[]')` rather than a length test:
    # `length()` does not exist in the expression language actionlint enforces
    # here, and `inputs.canary != '[]'` would be a string comparison pretending
    # to be a collection one. Comparing the parsed collection against a parsed
    # empty array is the honest test and needs no helper.
    if: ${{ fromJson(inputs.canary) != fromJson('[]') }}
    # `needs: smoke`, not just `build_and_upload`. ADR-0014's ladder is
    # upload -> smoke test -> 1%, and `needs` is the only thing that enforces
    # that order. With `needs: [build_and_upload]` alone, GitHub would run this
    # job in parallel with `smoke` — two runners racing, and nothing stopping
    # the 1% promotion from finishing first. A canary that starts before the
    # version has answered /health has not been smoke-tested at the moment it
    # began serving, which is the one thing the smoke test exists to guarantee.
    needs: [build_and_upload, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WORKER: ${{ inputs.worker }}
      LANE: ${{ inputs.lane }}
      WORKER_NAME: ${{ inputs.worker-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION_ID: ${{ needs.build_and_upload.outputs.version-id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Identity Workers' live host, and home-web's own. Same two-variable
      # rule as the smoke job and for the same reason: the health gate observes
      # a MIX of old and new bytes, so pointing home-web's gate at Identity's
      # host would measure the wrong deployment's traffic and report the result
      # as home-web's.
      SMOKE_HOST: ${{ vars.SMOKE_PROBE_BASE_URL }}
      HOME_SMOKE_BASE_URL: ${{ inputs.home-smoke-base-url }}
      IS_HOME_WEB: ${{ inputs.worker == 'home-web' && 'true' || 'false' }}
    steps:
      # NO CHECKOUT, and this job does not build. It names an already-uploaded
      # Version, and the guarantee it rests on is that the bytes it sends
      # traffic to are the bytes that were built, uploaded and smoke-tested.
      # Building here would make every canary step a rebuild (ADR-0013); that is
      # why there is no `moon run`, no cargo and no web app below.
      #
      # It previously checked the repository out and ran
      # `pnpm install --frozen-lockfile` to execute ONE wrangler command. The
      # toolchain is now read from the API at `main` and wrangler comes from
      # the npm registry at the pinned version — the arrangement `rollback.yml`
      # already uses, and the only one that works on a runner with no
      # `node_modules`. `pnpm exec wrangler` resolves the binary out of that
      # directory, so the checkout was not merely slow here; keeping it while
      # dropping the install would have failed every step with
      # `Command "wrangler" not found`.
      - name: Read the repository's pinned toolchain from the API (no checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="main"
          read_one() {
            gh api "repos/${{ github.repository }}/contents/$1?ref=$REF" --jq '.content' \
              | base64 --decode
          }
          NODE_VERSION="$(read_one .node-version | tr -d '[:space:]')"
          WRANGLER_VERSION="$(read_one package.json \
            | jq -er '.devDependencies.wrangler | ltrimstr("^") | select(type == "string" and length > 0)')"
          WRANGLER_VERSION="${WRANGLER_VERSION%%+*}"

          # Node before anything else: wrangler 4.x declares `node >=22`, and a
          # runner whose image drifts below that must fail here with the reason,
          # not two steps later with a syntax error.
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::could not read .node-version from $REF. The wrangler command in this job needs a pinned Node and there is no checkout to read it from."
            exit 1
          fi
          # THE WRAPPER ITSELF HAS TO COME FROM SOMEWHERE. Dropping the
          # checkout took the repository's own files with it, and the four
          # wrangler steps in these jobs run
          # `bash tooling/scripts/wrangler-step.sh` to make their failures
          # legible. Without this line every one of them would die with
          # `bash: tooling/scripts/wrangler-step.sh: No such file or
          # directory` — a run that looks like a wrangler failure and is not
          # one. So the wrapper is fetched from the API at the same ref as the
          # toolchain it names, into $RUNNER_TEMP, and used from there.
          #
          # `$REF` and not the running SHA, matching `rollback.yml`: these jobs
          # read what the repository currently declares rather than what the
          # deploy commit declared, so a mid-incident commit cannot change the
          # toolchain out from under a rollback or a promotion.
          STEP_PATH="$RUNNER_TEMP/wrangler-step.sh"
          if ! gh api "repos/${{ github.repository }}/contents/tooling/scripts/wrangler-step.sh?ref=$REF" \
            --jq '.content' | base64 --decode > "$STEP_PATH"; then
            echo "::error::could not read tooling/scripts/wrangler-step.sh from $REF. It is the wrapper that turns a wrangler failure into a legible annotation, and a job that cannot fetch it cannot use it."
            exit 1
          fi
          if [ ! -s "$STEP_PATH" ]; then
            echo "::error::tooling/scripts/wrangler-step.sh fetched from $REF is empty. A wrapper that produces no annotation is not the wrapper; refusing to run one."
            exit 1
          fi
          echo "WRANGLER_STEP=$STEP_PATH" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          # The version, and the command spelling it names. `$WRANGLER_BIN` is
          # what `wrangler-step.sh` executes; `$WRANGLER_VERSION` is for the
          # `deployments list` verification below, which is NOT wrapped and so
          # must name wrangler itself.
          #
          # That last distinction matters and it was a bug once: the wrapped
          # steps run the command through a wrapper whose shell splits it, but
          # `$WRANGLER_BIN deployments list` relies on the RUNNER's shell
          # splitting an unquoted variable into a command. Under bash — which is
          # what a `run:` step gets — that works. Under zsh it does not, and it
          # did not fail loudly either: the call is followed by
          # `|| echo "::warning::…"`, so a `command not found` became a warning
          # and the step went green having verified nothing. A check that
          # cannot run is not a pass, so the bare call spells the command out.
          echo "WRANGLER_BIN=npx --yes wrangler@$WRANGLER_VERSION" >> "$GITHUB_ENV"
          echo "WRANGLER_VERSION=$WRANGLER_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read the Cloudflare account id from the topology
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(gh api \
            "repos/${{ github.repository }}/contents/infra-topology/topology.json?ref=main" \
            --jq '.content' | base64 --decode \
            | jq -er '.account.id | select(type == "string" and length > 0)')" \
            || { echo "::error::infra-topology/topology.json declares no usable account.id. Every wrangler command in this job needs it, and there is nowhere else to read it from."; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Promote each step of the ladder, with a health gate between
        env:
          LADDER: ${{ inputs.canary }}
        run: |
          set -euo pipefail

          # Which host this lane's gate observes. Resolved ONCE, before the
          # ladder starts, and it fails closed: a canary that cannot be gated
          # must not run at all, because the alternative is a ladder that
          # promotes percentages with nothing observing them.
          #
          # And which ROUTE. home-web has no /health (ADR-0016: it is a public
          # site, not an Identity Worker), so probing it there would fail a
          # correct deployment at 1% and abandon a good version. Its gate is
          # `/`, which is the same liveness question one path deeper: does the
          # host answer at all while serving this percentage.
          #
          # The gate is a LIVENESS gate, not the smoke test. It answers "is the
          # host responding", not "did we deploy the right bytes" — the smoke
          # job and the version-id lookup answer that, and ADR-0014 step 1 is
          # explicit that a failed probe is an answer, not a delay.
          if [ "$IS_HOME_WEB" = "true" ]; then
            if [ -z "$HOME_SMOKE_BASE_URL" ]; then
              echo "::error::no home-web health-gate host is configured for the '$LANE' lane (expected the repository variable passed as home-smoke-base-url). The ladder is not walked: a canary with no gate is not a canary. Set the variable and dispatch again; nothing has been promoted."
              exit 1
            fi
            PROBE_BASE_URL="${HOME_SMOKE_BASE_URL%/}"
            PROBE_ROUTE="/"
          else
            if [ -z "$SMOKE_HOST" ]; then
              echo "::error::no smoke-probe host is configured for this lane, so the health gate cannot run. A gate that cannot run is not a pass; the ladder stops here rather than promoting blind."
              exit 1
            fi
            PROBE_BASE_URL="${SMOKE_HOST%/}"
            PROBE_ROUTE="/health"
          fi
          echo "Health gate probes ${PROBE_BASE_URL}${PROBE_ROUTE}"

          printf '%s' "$LADDER" | python3 -c '
          import json, sys
          for percentage in json.load(sys.stdin):
              print(percentage)
          ' | while read -r PERCENTAGE; do
              echo "::group::promoting $WORKER to ${PERCENTAGE}% of traffic (version $VERSION_ID)"
              # `--name`, not `--config`: see `promote_to_final`. A Deployment
              # is a routing rule over a Worker name and an already-uploaded
              # Version id; the bindings went into the version at upload and
              # cannot be changed here. Naming a config would also mean carrying
              # a file with real Cloudflare ids across a job boundary for an
              # operation that never reads them.
              bash "$WRANGLER_STEP" "promote a version" -- versions deploy \
                --name "$WORKER_NAME" \
                --version-id "$VERSION_ID" \
                --percentage "$PERCENTAGE" \
                --message "release $RELEASE_TAG at ${PERCENTAGE}%" \
                --yes
              echo "::endgroup::"

              # THE HEALTH GATE. It runs between steps and ABORTS the ladder on
              # a failed probe, because a failed probe is an answer and not a
              # delay (ADR-0014 step 1). The failures it exists to catch are
              # the ones that only appear with real traffic: a cache that was
              # warm in staging and is cold here, a rate limiter that behaves
              # differently at production volume.
              #
              # It probes `$PROBE_BASE_URL` — the lane's LIVE host — and NOT the
              # version preview URL, and the distinction is the honest one: at a
              # canary percentage the host is genuinely serving a mix of the
              # new and old version, and that mix is precisely what the gate
              # exists to observe. A probe against a preview URL would measure
              # only the new version and would pass for a deployment that fails
              # the moment it carries production-shaped traffic, which is the
              # failure the ladder is built to catch.
              #
              # `sleep` before the first probe is not politeness. Cloudflare
              # propagates a Deployment change at the edge over a short
              # window, and a probe fired in the first second can hit a POP
              # still routing to the old version and report a false green —
              # which is the exact failure a health gate must not have.
              echo "::group::health gate at ${PERCENTAGE}%"
              sleep 20
              ATTEMPTS=12
              OK=0
              for attempt in $(seq 1 "$ATTEMPTS"); do
                if curl --fail --silent --show-error --max-time 10 \
                     -H 'Cache-Control: no-cache' \
                     "${PROBE_BASE_URL}${PROBE_ROUTE}" > /dev/null; then
                  echo "  ${PROBE_ROUTE} answered on attempt ${attempt}"
                  OK=1
                  break
                fi
                echo "  ${PROBE_ROUTE} did not answer on attempt ${attempt}; retrying"
                sleep 10
              done
              if [ "$OK" -ne 1 ]; then
                echo "::error::health gate failed at ${PERCENTAGE}% after $ATTEMPTS attempts. Abandoning the ladder — the uploaded version is NOT promoted further and is still there, un-promoted, for inspection (ADR-0013). Rolling back is `rollback.yml`; it is a promotion of an existing version id and never rebuilds."
                exit 1
              fi
              echo "::endgroup::"
            done

          # The percentage the ladder ended at, not the ladder itself: `$LADDER`
          # is the JSON array `[1,10]`, and printing "$LADDER%" would put
          # `[1,10]%` in a summary a human reads during an incident.
          ENDED_AT="$(printf '%s' "$LADDER" | python3 -c 'import json, sys; print(json.load(sys.stdin)[-1])')"
          {
            echo "### Canary complete"
            echo ""
            echo "- \`$WORKER\` is at **${ENDED_AT}%** on version \`$VERSION_ID\`"
            echo "- The ladder stops here. Promotion past this point is a separate"
            echo "  job with its own approval, because the decision to make a new"
            echo "  version the majority of production traffic is a human's."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The smoke test. Separate from the canary job on purpose: it must be able to
  # run against a version that is NOT serving any traffic, which is the only
  # state in which a smoke test is safe to run at all. It therefore runs
  # between the upload and every promotion, and a failure here stops the
  # pipeline before anything serves.
  #
  # ---------------------------------------------------------------------------
  # WHAT THIS PROBES, AND WHAT IT DOES NOT
  # ---------------------------------------------------------------------------
  # It probes `$SMOKE_HOST`, which is the LANE'S LIVE HOST (`vars.SMOKE_PROBE_
  # BASE_URL`), NOT the version preview URL. Two consequences, and this file
  # states both rather than letting a reader assume the stronger one:
  #
  #   1. This job is not a preview test. It cannot tell a freshly uploaded,
  #      unpromoted version from whatever the host was serving a moment ago.
  #      The upload is verified by `wrangler versions upload` exiting zero and
  #      by the version-id resolving from its tag — not by this probe.
  #   2. The canary health gate below is the one that DOES observe new bytes,
  #      because a canary percentage routes a real share of requests to them.
  #
  # That division is deliberate and pre-existing. The comment this replaces
  # claimed the smoke test probed the preview URL, which the code beneath it
  # never did; the code is the truthful part and the comment was the defect.
  # Fixing the comment rather than the code is not a judgement that the live
  # host is the right probe — it is the smaller change, and the alternative is a
  # rewrite of Identity Workers' deployment-verification behaviour that belongs
  # in its own decision. It is reported as a defect rather than absorbed here;
  # see `docs/operations/deployment-model.md`.
  #
  # ---------------------------------------------------------------------------
  # TWO CONTRACTS, ONE PER DEPLOYABLE SHAPE
  # ---------------------------------------------------------------------------
  #   Identity Workers: /health answers 200 for all three; /ready answers the
  #                    status its own binary is built to answer (identity 200,
  #                    identity-admin 503, identity-jobs 503), and its body must
  #                    report that deployable as not ready. The table in the
  #                    smoke step below names the Rust file behind each row.
  #   home-web:        / must answer 200 with the landing page, and one
  #                    emitted `/_nuxt/` client asset must be served
  #
  # home-web serves no /health and no /ready — it is a public site, not an
  # Identity Worker (ADR-0016), and it holds no readiness state to report.
  # Probing it for those routes would fail a correct deployment for the crime
  # of not being a different deployable.
  #
  # The home-web branch is the REMOTE mirror of
  # `apps/home-web/tests/worker-smoke.test.mjs`, which asserts the same three
  # things against a local Worker runtime. A weaker remote check would let a
  # deployment pass here that the repository's own test rejects locally, and
  # the two drifting apart is how a green pipeline starts meaning less than its
  # test suite.
  # ---------------------------------------------------------------------------
  smoke:
    name: Smoke test ${{ inputs.worker }} (${{ inputs.environment }})
    needs: build_and_upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKER: ${{ inputs.worker }}
      LANE: ${{ inputs.lane }}
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION_ID: ${{ needs.build_and_upload.outputs.version-id }}
      # NO CLOUDFLARE_API_TOKEN. This job used to hold one and never used it:
      # it runs no wrangler command, writes nothing and reads nothing from the
      # Cloudflare API — it `curl`s a public host over HTTPS and asserts what
      # came back. A credential a job does not need is a credential that can
      # leak from a job that does, so the grant is gone rather than left
      # unreferenced. Nothing below resolves it: if a step here ever needs to
      # reach the API, that step needs its own token and its own reason.
      # The Identity Workers' live host. Read from the repository's own
      # namespace here rather than passed by the caller, because it predates
      # the second deployable and changing it would touch all three Identity
      # callers for no reason.
      SMOKE_HOST: ${{ vars.SMOKE_PROBE_BASE_URL }}
      # home-web's own host, per lane, passed by the caller. It is NOT a
      # fallback to `SMOKE_HOST`: an absent value is a non-zero exit in the
      # step below, because probing the Identity host with a landing-page
      # assertion would report a green run for a site it never reached.
      HOME_SMOKE_BASE_URL: ${{ inputs.home-smoke-base-url }}
      IS_HOME_WEB: ${{ inputs.worker == 'home-web' && 'true' || 'false' }}
    steps:
      # NO CHECKOUT, NO pnpm, NO TOOLCHAIN AT ALL. This job's only step below
      # is `curl` and `grep` against a public host, and the runner image ships
      # both. It used to check the repository out, set up pnpm and Node, install
      # the lockfile, read the Cloudflare account id out of `topology.json` and
      # hold the Cloudflare API token — none of which any step below touched.
      # `jq` is still used by the assertions, and it is preinstalled on
      # `ubuntu-latest`; if that ever stops being true the step fails loudly
      # rather than silently skipping a body assertion.
      - name: The version must answer this deployable's smoke contract
        run: |
          set -euo pipefail

          # ---- which host, and why the absence is fatal -------------------
          # Two variables, two deployables, and no fallback between them. The
          # Identity Workers read the lane's live host; home-web reads the host
          # its own caller passed. An empty value in EITHER case exits
          # non-zero, because a check that cannot run is not a pass (AGENTS.md),
          # and because an empty home-web value that silently became
          # `$SMOKE_HOST` would assert a landing page against Identity's host
          # and report a green run for a public site it never reached.
          if [ "$IS_HOME_WEB" = "true" ]; then
            if [ -z "$HOME_SMOKE_BASE_URL" ]; then
              echo "::error::no home-web smoke host is configured for the '$LANE' lane. Set the repository variable this job's caller passes as home-smoke-base-url (HOME_WEB_STAGING_SMOKE_PROBE_BASE_URL for staging, HOME_WEB_PRODUCTION_SMOKE_PROBE_BASE_URL for production) and dispatch again. This check will NOT fall back to SMOKE_PROBE_BASE_URL: that host belongs to the Identity Workers, and probing it would make this check report on a deployment it did not test."
              exit 1
            fi
            HOST="$HOME_SMOKE_BASE_URL"
          else
            if [ -z "$SMOKE_HOST" ]; then
              # Loudly, and non-zero. A missing probe host is a check that cannot
              # run, and AGENTS.md is explicit that one exits non-zero rather than
              # reporting a success it did not earn. The fix is a repository
              # variable, not an edit to this check.
              echo "::error::no smoke-probe host is configured for this lane (expected the SMOKE_PROBE_BASE_URL repository variable to be set). This check cannot run, and a check that cannot run is not a pass."
              exit 1
            fi
            HOST="$SMOKE_HOST"
          fi
          # A trailing slash would make "${HOST}/health" a double slash, which
          # some hosts 404 and some redirect. Normalised here rather than
          # documented as a requirement on the variable's author.
          HOST="${HOST%/}"
          echo "Probing $HOST for $WORKER version $VERSION_ID (lane $LANE)"

          # ---- home-web: the landing page and an emitted client asset -----
          # These three assertions are the remote mirror of
          # `apps/home-web/tests/worker-smoke.test.mjs`, and they are
          # deliberately the same three, not a reduced remote edition:
          #
          #   1. `/` answers 200
          #   2. the HTML carries the landing page's stable markers
          #   3. an emitted `/_nuxt/` asset is served, as nonempty JavaScript
          #
          # (2) is what makes this a smoke test rather than a reachability
          # check: a 200 from an error page, a redirect to a login wall, or an
          # empty shell all satisfy (1). The markers are the document `<title>`
          # and the one line of copy that identifies the product; if the landing
          # page is redesigned and those change, THIS step fails in the same
          # commit that changes them, which is the intended coupling.
          #
          # (3) is the assertion that catches the failure mode nobody tests for:
          # an `.output/public` that did not make it into the uploaded asset
          # bundle. The HTML would still render — it is server-rendered — while
          # every client script 404s, so the site would be navigable and inert.
          # That is exactly the half-built state that produces no error in any
          # other check in this workflow.
          if [ "$IS_HOME_WEB" = "true" ]; then
            # `|| true`, NOT `|| echo 000`. `curl --write-out '%{http_code}'`
            # already prints `000` when it cannot connect, so the `|| echo 000`
            # this replaced appended a SECOND 000 and reported the failure as
            # `HTTP 000000` — a status no server produced. It failed closed
            # either way, so this was never a wrong verdict; it was a wrong
            # diagnostic in the exact line an operator reads during an incident.
            STATUS="$(curl --silent --show-error --max-time 20 \
              -o /dev/null --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "${HOST}/" || true)"
            echo "  / -> HTTP ${STATUS}"
            if [ "$STATUS" != "200" ]; then
              echo "::error::home-web answered / with HTTP ${STATUS}, not 200. The version is uploaded but NOT promoted. Fix the landing page and cut a new release — do not promote this one (ADR-0013: a rebuild is a forward fix, not a rollback)."
              exit 1
            fi

            # Two temp files, both removed on every exit path including the
            # error ones: the HTML is needed twice (markers, then the asset
            # path) and the headers are read after the body is fetched.
            LANDING_HTML="$(mktemp)"
            ASSET_BODY="$(mktemp)"
            ASSET_HEADERS="$(mktemp)"
            cleanup() { rm -f "$LANDING_HTML" "$ASSET_BODY" "$ASSET_HEADERS"; }
            trap cleanup EXIT

            curl --silent --show-error --fail --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -o "$LANDING_HTML" "${HOST}/"

            # Asserted BY NAME, so a failure says which marker is missing rather
            # than only that the body did not match. These are the same two
            # markers `apps/home-web/tests/worker-smoke.test.mjs` asserts, and
            # the two must change together.
            for MARKER in '<title>Ecoma</title>' 'Fair-code labor OS'; do
              if ! grep -qF -- "$MARKER" "$LANDING_HTML"; then
                echo "::error::home-web's landing page did not contain the marker ${MARKER}. The page answered 200, so it is being served — but it is not the landing page this repository ships. If the landing page was redesigned, update this check and apps/home-web/tests/worker-smoke.test.mjs in the same commit (docs/operations/deployment-model.md owns the contract)."
                exit 1
              fi
            done
            echo "  landing page markers present"

            # Extract the FIRST emitted client asset path from the rendered
            # HTML, exactly as the local test's regex does (`<script src=...>`
            # only — an asset referenced from a stylesheet or a preload would
            # answer with a content type this check does not accept, and the
            # JavaScript assertion below is the point of the whole step).
            #
            # `head -n 1` closes the pipe, which under `set -o pipefail` makes
            # grep exit 141 (SIGPIPE) — so `|| true` is required here rather
            # than defensive, and the emptiness check below is what actually
            # decides pass or fail. A `pipefail` mistake in this step would
            # otherwise abort a run over a successful probe.
            ASSET_PATH="$(grep -oE '<script[^>]+src="[^"]*/_nuxt/[^"]+"' "$LANDING_HTML" \
              | head -n 1 | sed -E 's/.*src="([^"]*)".*/\1/' || true)"
            if [ -z "$ASSET_PATH" ]; then
              echo "::error::home-web's landing page contained no emitted Nuxt client asset (a <script src=\".../_nuxt/...\"> tag). The HTML rendered, so the server is up, but the client bundle is missing from the asset bundle — which is a deployment that serves an inert page."
              exit 1
            fi
            echo "  emitted client asset: ${ASSET_PATH}"

            ASSET_STATUS="$(curl --silent --show-error --max-time 20 \
              -o "$ASSET_BODY" --dump-header "$ASSET_HEADERS" \
              --write-out '%{http_code}' "${HOST}${ASSET_PATH}" || true)"
            echo "  ${ASSET_PATH} -> HTTP ${ASSET_STATUS}"
            if [ "$ASSET_STATUS" != "200" ]; then
              echo "::error::home-web's emitted client asset ${ASSET_PATH} answered HTTP ${ASSET_STATUS}, not 200. The landing page renders but its JavaScript does not load. The version is uploaded but NOT promoted."
              exit 1
            fi

            CONTENT_TYPE="$(grep -i '^content-type:' "$ASSET_HEADERS" | tail -n 1 | tr -d '\r')"
            if ! printf '%s' "$CONTENT_TYPE" | grep -qi 'javascript'; then
              echo "::error::home-web's emitted client asset ${ASSET_PATH} was served as '${CONTENT_TYPE:-no content type}', not JavaScript. An empty 200 on an asset request is not an asset."
              exit 1
            fi
            ASSET_BYTES="$(wc -c < "$ASSET_BODY" | tr -d ' ')"
            if [ "$ASSET_BYTES" -eq 0 ]; then
              echo "::error::home-web's emitted client asset ${ASSET_PATH} was served as an empty 200. The asset exists in the bundle but has no bytes."
              exit 1
            fi
            echo "  content-type: ${CONTENT_TYPE#*: }"
            echo "  bytes: ${ASSET_BYTES}"
            echo "home-web served its landing page and a nonempty JavaScript client asset on version $VERSION_ID."
            exit 0
          fi

          # ---- Identity Workers: /health and /ready ------------------------
          # THE CONTRACT IS PER-DEPLOYABLE, and the table below is the whole
          # reason this step exists rather than a loop over two routes. It used
          # to require a 200 from both routes for all three Identity Workers,
          # which two of them cannot produce: `identity-admin`
          # (`apps/identity-admin/worker/src/lib.rs`, `Answer::status()`) and
          # `identity-jobs` (`apps/identity-jobs/worker/src/lib.rs`, same
          # method) answer `/ready` with **503 by design**, not by accident. A
          # step that demanded a 200 there was not a stricter contract, it was a
          # false claim about two deployables — and it made
          # `promote_to_final` (`needs: [build_and_upload, smoke]`) permanently
          # unreachable for them, in staging and in production alike.
          #
          # Every expectation below is read out of the Rust that answers the
          # route, and each line names the file it came from so a reviewer can
          # check it rather than trust it:
          #
          #   deployable      /health   /ready    named by
          #   identity        200       200       Route::status(), identity/worker/src/lib.rs
          #   identity-admin  200       503       Answer::status(), identity-admin/worker/src/lib.rs
          #   identity-jobs   200       503       Answer::status(), identity-jobs/worker/src/lib.rs
          #
          # An unknown deployable is a hard error below rather than a default.
          # A fallback that guessed 200 for a fourth Worker would let a deployable
          # nobody wrote a row for pass a contract nobody reviewed, and that is
          # the failure mode AGENTS.md's status vocabulary exists to prevent.
          #
          # THE BODY IS ASSERTED, not just the status, and this is the part that
          # makes the status half of the table safe. A status match alone cannot
          # tell an honest Worker from one that has started claiming a readiness
          # it does not have: `identity-admin` answering 200 on `/ready` would
          # satisfy the status column of its own row while asserting the
          # opposite of what the row means. So the body of `/ready` is read and
          # every one of the three must carry its own unambiguous "not ready"
          # marker, matched on the deployable's OWN field name — identity says
          # `"ready":false`, and admin and jobs say `"status":"not_ready"`. A
          # Worker that answered 200 having quietly stopped reporting
          # un-readiness would fail here.
          #
          # Note what is NOT asserted: that `/ready` answers 200 anywhere, and
          # that any protocol route answers anything but 501. Requiring either
          # would be a test for a capability that does not exist, which is the
          # one thing AGENTS.md forbids outright. `identity` answering `/ready`
          # with 200 while carrying `ready: false` is not an inconsistency this
          # step resolves — it is a question about probe semantics and how
          # Cloudflare routes on `/ready`, and it is filed as an issue rather
          # than settled inside a workflow file.
          #
          # `home-web` never reaches any of this: it has no /health and no
          # /ready, and it exited above.
          case "$WORKER" in
            identity)       READY_STATUS=200 ;;
            identity-admin) READY_STATUS=503 ;;
            identity-jobs)  READY_STATUS=503 ;;
            *)
              echo "::error::no smoke expectation is declared for the deployable '${WORKER}'. This step knows ${WORKER}'s /health and /ready expectations only for identity, identity-admin and identity-jobs, and it will not guess one: a default would be a contract nobody reviewed, applied to a deployable nobody checked. Add a row here naming the status each route answers, with the Rust file that decides it."
              exit 1
              ;;
          esac

          # `/health` is liveness and all three answer 200. `/ready` answers the
          # status its own binary is built to answer, which is 200 only for
          # `identity` — see the table above.
          # `|| true`, not `|| echo 000`: curl's `--write-out '%{http_code}'`
          # prints `000` itself on a connection failure, so the fallback
          # appended a second one. See the note on the home-web branch above.
          probe() {
            # $1 route, $2 the status that route must answer. Fetches ONCE and
            # echoes the body on stdout, so the caller captures body and status
            # from a single request — a second probe could land on a version
            # that answered differently, and the status and the body being
            # asserted must come from the same response.
            local route="$1" expected="$2" body_file
            body_file="$(mktemp)"
            STATUS="$(curl --silent --show-error --max-time 15 \
              -o "$body_file" --write-out '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "${HOST}${route}" || true)"
            cat "$body_file"
            rm -f "$body_file"
            [ "$STATUS" = "$expected" ] || {
              echo "::error::${WORKER} answered ${route} with HTTP ${STATUS}, not ${expected}. The version is uploaded but NOT promoted; nothing has been sent to it. Fix the Worker and cut a new release — do not promote this one (ADR-0013: a rebuild is a forward fix, not a rollback)." >&2
              return 1
            }
          }

          HEALTH_BODY="$(probe /health 200)" || exit 1
          echo "  /health -> HTTP 200"
          # Liveness and nothing else, and the field that says so is the one
          # thing all three Workers spell the same way: `ok` on identity,
          # `status:"ok"` on admin and jobs.
          case "$WORKER" in
            identity)
              echo "$HEALTH_BODY" | jq -e '.ok == true' > /dev/null \
                || { echo "::error::identity answered /health 200 without 'ok':true. A 200 on liveness is the Worker's promise that the process is up; a body that does not say so means the route is answering something else. The version is uploaded but NOT promoted."; exit 1; }
              ;;
            *)
              echo "$HEALTH_BODY" | jq -e '.status == "ok"' > /dev/null \
                || { echo "::error::${WORKER} answered /health 200 without 'status\":\"ok\"'. That is the field the Worker reports liveness in (apps/${WORKER}/worker/src/lib.rs). A 200 whose body does not carry it is not the health report this repository ships. The version is uploaded but NOT promoted."; exit 1; }
              ;;
          esac

          READY_BODY="$(probe /ready "$READY_STATUS")" || exit 1
          echo "  /ready -> HTTP ${READY_STATUS}"
          # The per-deployable honesty assertion. Each branch matches the field
          # its own Worker writes, and a mismatch names the file that writes it
          # so the failure is actionable without reading this file.
          case "$WORKER" in
            identity)
              echo "$READY_BODY" | jq -e '.ready == false and .authentication == "not_implemented"' > /dev/null \
                || { echo "::error::identity answered /ready ${READY_STATUS} without 'ready':false and 'authentication\":\"not_implemented\"'. At this bootstrap those are the two facts /ready exists to report (apps/identity/worker/src/lib.rs, ReadinessReport::current), and a body that reports readiness the repository does not have is exactly the overstatement AGENTS.md forbids — a green run must never be the reason anyone believes identity can authenticate somebody. The version is uploaded but NOT promoted."; exit 1; }
              ;;
            identity-admin|identity-jobs)
              echo "$READY_BODY" | jq -e '.status == "not_ready"' > /dev/null \
                || { echo "::error::${WORKER} answered /ready ${READY_STATUS} without 'status\":\"not_ready\"'. That is the field this Worker reports its own readiness in (apps/${WORKER}/worker/src/lib.rs, ReadyBody), and a 503 or a 200 that does not carry it means the Worker has stopped saying out loud what it cannot do. The version is uploaded but NOT promoted."; exit 1; }
              ;;
          esac
          echo "$WORKER answered /health 200 and /ready ${READY_STATUS}, reporting itself not ready, on version $VERSION_ID."

  # ---------------------------------------------------------------------------
  # The final promotion. Two jobs, not one, and the split is the decision.
  #
  # `promote_to_final` carries NO `environment:` key and runs automatically —
  # it is the stage of the ladder that policy has already approved, and for
  # admin and jobs it is the only promotion there is. `promote_to_final_with_
  # approval` carries `environment: production` and the runner will not pass it
  # without a named approver. That asymmetry is ADR-0014's central mechanical
  # point: a gate enforced by an `if:` in a workflow file can be deleted by the
  # same pull request that would benefit from deleting it, whereas an
  # environment's required reviewers are repository settings a pull request
  # cannot change. Neither job can be reached without a version id from
  # `build_and_upload`, so no promotion can build.
  # ---------------------------------------------------------------------------
  promote_to_final:
    name: Promote ${{ inputs.worker }} to ${{ inputs.final-percentage }}% (${{ inputs.environment }})
    needs: [build_and_upload, smoke]
    # The automatic lane, and the ONLY promotion `identity-admin` and
    # `identity-jobs` ever get (ADR-0014 constraint 20, step 4). Also reached
    # by any `identity` call whose ladder ends below the policy limit — a
    # rehearsal lane, where a human gate would buy nothing because staging is
    # not production traffic.
    #
    # Never reached for `identity` in production: `promote_to_policy_limit` and
    # `promote_to_full_percentage` supersede it whenever a policy limit is
    # configured, and running this as well would be three promotions racing for
    # one Deployment. `!inputs.requires-approval` alone would not have caught
    # that — hence the `inputs.policy-limit-percentage` clause, which is the
    # real test for "is this the gated lane".
    if: ${{ !inputs.requires-approval && inputs.policy-limit-percentage == 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      percentage: ${{ steps.promote.outputs.percentage }}
    env:
      WORKER: ${{ inputs.worker }}
      LANE: ${{ inputs.lane }}
      WORKER_NAME: ${{ inputs.worker-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_TAG: ${{ inputs.tag }}
      VERSION_ID: ${{ needs.build_and_upload.outputs.version-id }}
      FINAL_PERCENTAGE: ${{ inputs.final-percentage }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # NO CHECKOUT, and this job does not build — that is the whole safety of
      # the operation. `wrangler versions deploy` names an already-uploaded
      # Version and creates a Deployment pointing at it, and what makes that
      # safe is that the bytes promoted are the bytes that were uploaded and
      # smoke-tested. No `moon run`, no `pnpm build`, no cargo, no web app.
      # Building here would make every promotion a rebuild (ADR-0013), and a
      # checkout that produces no build is 40 seconds and ~1,400 packages spent
      # so that one wrangler command can resolve out of `node_modules`.
      #
      # The toolchain comes from the API at `main` and wrangler from the npm
      # registry at the pinned version — the arrangement `rollback.yml` already
      # uses and the only one that works with no `node_modules`. `WRANGLER_BIN`
      # is what `wrangler-step.sh` runs; it defaults to `pnpm exec wrangler`
      # where there IS a checkout, and is set here because there is not.
      - name: Read the repository's pinned toolchain from the API (no checkout)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="main"
          read_one() {
            gh api "repos/${{ github.repository }}/contents/$1?ref=$REF" --jq '.content' \
              | base64 --decode
          }
          NODE_VERSION="$(read_one .node-version | tr -d '[:space:]')"
          WRANGLER_VERSION="$(read_one package.json \
            | jq -er '.devDependencies.wrangler | ltrimstr("^") | select(type == "string" and length > 0)')"
          WRANGLER_VERSION="${WRANGLER_VERSION%%+*}"

          # Node before anything else: wrangler 4.x declares `node >=22`, and a
          # runner whose image drifts below that must fail here with the reason,
          # not two steps later with a syntax error.
          if [ -z "$NODE_VERSION" ]; then
            echo "::error::could not read .node-version from $REF. The wrangler commands in this job need a pinned Node and there is no checkout to read it from."
            exit 1
          fi
          # THE WRAPPER ITSELF HAS TO COME FROM SOMEWHERE. Dropping the
          # checkout took the repository's own files with it, and the four
          # wrangler steps in these jobs run
          # `bash tooling/scripts/wrangler-step.sh` to make their failures
          # legible. Without this line every one of them would die with
          # `bash: tooling/scripts/wrangler-step.sh: No such file or
          # directory` — a run that looks like a wrangler failure and is not
          # one. So the wrapper is fetched from the API at the same ref as the
          # toolchain it names, into $RUNNER_TEMP, and used from there.
          #
          # `$REF` and not the running SHA, matching `rollback.yml`: these jobs
          # read what the repository currently declares rather than what the
          # deploy commit declared, so a mid-incident commit cannot change the
          # toolchain out from under a rollback or a promotion.
          STEP_PATH="$RUNNER_TEMP/wrangler-step.sh"
          if ! gh api "repos/${{ github.repository }}/contents/tooling/scripts/wrangler-step.sh?ref=$REF" \
            --jq '.content' | base64 --decode > "$STEP_PATH"; then
            echo "::error::could not read tooling/scripts/wrangler-step.sh from $REF. It is the wrapper that turns a wrangler failure into a legible annotation, and a job that cannot fetch it cannot use it."
            exit 1
          fi
          if [ ! -s "$STEP_PATH" ]; then
            echo "::error::tooling/scripts/wrangler-step.sh fetched from $REF is empty. A wrapper that produces no annotation is not the wrapper; refusing to run one."
            exit 1
          fi
          echo "WRANGLER_STEP=$STEP_PATH" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$NODE_VERSION" >> "$GITHUB_ENV"
          # The version, and the command spelling it names. `$WRANGLER_BIN` is
          # what `wrangler-step.sh` executes; `$WRANGLER_VERSION` is for the
          # `deployments list` verification below, which is NOT wrapped and so
          # must name wrangler itself.
          #
          # That last distinction matters and it was a bug once: the wrapped
          # steps run the command through a wrapper whose shell splits it, but
          # `$WRANGLER_BIN deployments list` relies on the RUNNER's shell
          # splitting an unquoted variable into a command. Under bash — which is
          # what a `run:` step gets — that works. Under zsh it does not, and it
          # did not fail loudly either: the call is followed by
          # `|| echo "::warning::…"`, so a `command not found` became a warning
          # and the step went green having verified nothing. A check that
          # cannot run is not a pass, so the bare call spells the command out.
          echo "WRANGLER_BIN=npx --yes wrangler@$WRANGLER_VERSION" >> "$GITHUB_ENV"
          echo "WRANGLER_VERSION=$WRANGLER_VERSION" >> "$GITHUB_ENV"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Read the Cloudflare account id from the topology
