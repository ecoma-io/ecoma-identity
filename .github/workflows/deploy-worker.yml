  # ---------------------------------------------------------------------------
  # THE FIRST HUMAN GATE, at the policy limit (ADR-0014 step 2).
  #
  # A separate job from the 100% one, and the separation is the point rather
  # than tidiness: ADR-0014 step 7 says approving 50% and not approving 100% is
  # legitimate, so the two decisions cannot live in one job. One job with two
  # approval-bearing steps is one approval, one record and one approver — which
  # is precisely the thing ADR-0014 rejected when it declined to make 100%
  # automatic on the argument that a human's judgement is spent where it
  # changes the outcome.
  #
  # It needs `canary`, so the automatic ladder has finished its health-gated
  # walk before a human is asked. Asking somebody to approve traffic they
  # cannot yet see evidence about is how an approval stops meaning approval.
  # ---------------------------------------------------------------------------
  promote_to_policy_limit:
    name: Promote ${{ inputs.worker }} to ${{ inputs.policy-limit-percentage }}% — HUMAN APPROVAL REQUIRED (${{ inputs.environment }})
    needs: [build_and_upload, smoke, canary]
    # `policy-limit-percentage != 0` is the whole test. Zero is the "no gated
    # lane" sentinel rather than a percentage, because 0% traffic is a
    # deployment that serves nobody and `> 0` would read as "the limit is set
    # but at zero", which is a state nobody wants and no caller produces.
    if: ${{ inputs.requires-approval && inputs.policy-limit-percentage != 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
