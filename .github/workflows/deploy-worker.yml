          # `bash: tooling/scripts/wrangler-step.sh: No such file or
          # directory` — a run that looks like a wrangler failure and is not
          # one. So the wrapper is fetched from the API at the same ref as the
          # toolchain it names, into $RUNNER_TEMP, and used from there.
          #
          # `$REF` and not the running SHA, matching `rollback.yml`: these jobs
          # read what the repository currently declares rather than what the
          # deploy commit declared, so a mid-incident commit cannot change the
          # toolchain out from under a rollback or a promotion.
