          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(gh api \
            "repos/${{ github.repository }}/contents/infra-topology/topology.json?ref=main" \
            --jq '.content' | base64 --decode \
