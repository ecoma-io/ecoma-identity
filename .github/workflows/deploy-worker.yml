          set -euo pipefail
          ACCOUNT_ID="$(gh api \
            "repos/${{ github.repository }}/contents/infra-topology/topology.json?ref=main" \
            --jq '.content' | base64 --decode \
            | jq -er '.account.id | select(type == "string" and length > 0)')" \
            || { echo "::error::infra-topology/topology.json declares no usable account.id. Every wrangler command in this job needs it, and there is nowhere else to read it from."; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      # `--name` rather than `--config`, for the reason in `promote_to_final`:
      # a Deployment needs the Worker's name and a Version id, and the bindings
      # are already frozen into the version. Naming a config here would suggest
      # a promotion can rebind a version, and a version is immutable.
      - name: Promote the uploaded version to the policy limit
        id: promote
        run: |
          set -euo pipefail
          bash "$WRANGLER_STEP" "promote a version" -- versions deploy \
            --name "$WORKER_NAME" \
            --version-id "$VERSION_ID" \
            --percentage "$POLICY_LIMIT_PERCENTAGE" \
            --message "release $RELEASE_TAG at ${POLICY_LIMIT_PERCENTAGE}% (approved, gate 1 of 2)" \
            --yes
          echo "percentage=$POLICY_LIMIT_PERCENTAGE" >> "$GITHUB_OUTPUT"
          npx --yes "wrangler@$WRANGLER_VERSION" deployments list --name "$WORKER_NAME" \
            || echo "::warning::could not list deployments; the promotion above reported success."
          {
            echo "### Gate 1 passed — $WORKER at ${POLICY_LIMIT_PERCENTAGE}%"
            echo ""
            echo "- Version \`$VERSION_ID\` now carries **${POLICY_LIMIT_PERCENTAGE}%** of traffic."
            echo "- This is the policy limit (ADR-0014). The 100% promotion is a"
            echo "  SEPARATE job with its own approval, still pending: approving"
            echo "  this one is not approving that one."
            echo "- To abandon instead: promote a previous version id. The bad"
            echo "  version stays uploaded and immutable either way (ADR-0013)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # THE SECOND HUMAN GATE, at 100% (ADR-0014 step 2).
  #
  # `needs: promote_to_policy_limit`, which is what makes the two approvals
  # genuinely sequential and separable: it cannot start until the 50% job has
  # been approved AND completed. This is the gate ADR-0014 predicts will be the
  # first one removed under schedule pressure — "50% is already most of the
  # traffic" — and it is the hardest to remove by accident precisely because
  # it is a distinct environment approval with a distinct job.
  # ---------------------------------------------------------------------------
  promote_to_full_percentage:
    name: Promote ${{ inputs.worker }} to ${{ inputs.final-percentage }}% — HUMAN APPROVAL REQUIRED (${{ inputs.environment }})
    needs: [build_and_upload, smoke, promote_to_policy_limit]
    if: ${{ inputs.requires-approval && inputs.policy-limit-percentage != 0 }}
    runs-on: ubuntu-latest
